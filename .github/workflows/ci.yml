# ─────────────────────────────────────────────────────────────────────
# IORA OS — CI Pipeline
# Runs on every push to main and on PRs targeting main.
# Checks: Rust workspace compilation, frontend build, basic linting.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_frontend:
        description: "Also run the frontend job"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Rust workspace ─────────────────────────────────────────────────
  rust-check:
    name: Rust — check + test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GStreamer for iora-browserd)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev libglib2.0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iora-os/backend/target
          key: rust-${{ runner.os }}-${{ hashFiles('iora-os/backend/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Check formatting
        working-directory: iora-os/backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: iora-os/backend
        run: cargo clippy --all-targets --locked

      - name: Build workspace (release)
        working-directory: iora-os/backend
        run: cargo build --release --locked

      - name: Run tests
        working-directory: iora-os/backend
        run: cargo test --locked

      - name: Security Phase 1 regression gate
        working-directory: iora-os/backend
        run: cargo test --locked -p iora-security -p iora-security-helper

      - name: Enforce Security Foundation boundary
        run: python3 iora-os/tests/validate-security-baseline.py

      - name: Runtime Sensor 2.1 regression gate
        working-directory: iora-os/backend
        run: cargo test --locked -p iora-runtime-sensor

      - name: Runtime Identity 2.2 regression gate
        working-directory: iora-os/backend
        run: cargo test --locked -p iora-runtime-identity

      - name: Runtime Profiles and Detection 2.3/2.4 regression gate
        working-directory: iora-os/backend
        run: cargo test --locked -p iora-runtime-policy

      - name: Incident Correlation 2.5 regression gate
        working-directory: iora-os/backend
        run: cargo test --locked -p iora-incident-engine

  # ── Frontend ────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend — build + lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint || echo "Lint warnings ignored for CI"

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Supported targets overview (quick smoke) ───────────────────────
  defconfig-validate:
    name: Validate defconfigs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check all defconfigs exist
        run: |
          count=$(ls iora-os/configs/iora_defconfig* 2>/dev/null | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "ERROR: expected at least 2 defconfigs, found $count"
            ls iora-os/configs/ 2>/dev/null || true
            exit 1
          fi
          echo "Found $count defconfigs:"
          ls iora-os/configs/iora_defconfig*

      - name: Validate Security image integration
        run: |
          bash -n iora-os/board/iora/post-build.sh iora-os/tests/security-firewall-integration.sh
          for config in iora-os/configs/*defconfig*; do
            grep -qx 'BR2_PACKAGE_NFTABLES=y' "$config"
            grep -qx 'BR2_PACKAGE_CLAMAV=y' "$config"
            grep -qx 'BR2_PACKAGE_YARA=y' "$config"
          done
          grep -q 'iora-security:x:919:919' iora-os/board/iora/post-build.sh
          grep -q 'reserved security UID 919 is already assigned' iora-os/board/iora/post-build.sh
