version: '3.8'

# IORA Minimal Configuration
# Only critical services required for basic smart home functionality

services:
  # PostgreSQL Database (REQUIRED)
  postgres:
    image: postgres:16-alpine
    container_name: iora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iora_home}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - iora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      iora.managed: "true"
      iora.service: "postgres"
      iora.critical: "true"

  # IORA Core - Central orchestrator (REQUIRED)
  iora-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: iora-core
    container_name: iora-core
    image: iora/core:latest
    ports:
      - "${CORE_PORT:-8090}:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_core
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      iora.managed: "true"
      iora.service: "core"
      iora.critical: "true"

  # IORA Secrets - Encrypted secrets storage (REQUIRED)
  iora-secrets:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: iora-secrets
    container_name: iora-secrets
    image: iora/secrets:latest
    ports:
      - "${SECRETS_PORT:-8093}:8093"
    environment:
      - PORT=8093
      - DATABASE_URL=postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_secrets
      - SECRETS_MASTER_KEY=${SECRETS_MASTER_KEY}
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - apparmor=iora-secrets
    labels:
      iora.managed: "true"
      iora.service: "secrets"
      iora.critical: "true"

  # IORA Home - Smart Home server (REQUIRED)
  iora-home:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: iora-home
    container_name: iora-home
    image: iora/home:latest
    ports:
      - "${HOME_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_home
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - IORA_CORE_URL=http://iora-core:8090
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      iora-core:
        condition: service_started
    labels:
      iora.managed: "true"
      iora.service: "home"
      iora.critical: "true"

networks:
  iora-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
