[package]
name = "rumahl-security-helper"
version = "0.1.0"
edition = "2021"
description = "Least-privilege host enforcement helper for rumahl Security"

[dependencies]
anyhow = "1.0"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
