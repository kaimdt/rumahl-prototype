[package]
name = "rumahl-updater"
version = "0.1.0"
edition = "2021"
description = "rumahl OS update installer (RAUC A/B)"
publish = false

[[bin]]
name = "rumahl-updater"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2" }
rumahl-shared-config = { path = "../../shared/rumahl-shared-config" }
