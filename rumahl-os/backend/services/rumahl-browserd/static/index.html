<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rumahl Browser</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --border: #2c3038;
    --text: #e6e8eb;
    --text-dim: #9aa0aa;
    --accent: #6366f1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  /* ── Tab bar ── */
  #tabbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    min-height: 38px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 200px;
    min-width: 90px;
    padding: 5px 8px 5px 12px;
    border-radius: 8px 8px 0 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    user-select: none;
  }
  .tab.active { background: #262a33; color: var(--text); }
  .tab .t-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tab .t-close {
    border: none; background: none; color: var(--text-dim);
    font-size: 14px; cursor: pointer; padding: 0 2px; border-radius: 4px;
  }
  .tab .t-close:hover { background: rgba(255,255,255,.12); color: var(--text); }
  #tab-new {
    border: none; background: none; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 2px 10px; border-radius: 6px;
  }
  #tab-new:hover { background: var(--panel); color: var(--text); }
  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    width: 32px; height: 32px;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:hover:not(:disabled) { background: #2a2e37; }
  .btn:disabled { opacity: .35; cursor: default; }
  #urlbar {
    flex: 1;
    height: 32px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 0 12px;
    font-size: 13px;
    outline: none;
  }
  #urlbar:focus { border-color: var(--accent); }
  /* ── Surface ── */
  #surface-wrap { flex: 1; position: relative; min-height: 0; background: #000; }
  #surface {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #111318;
    cursor: default;
    outline: none;
  }
  #surface-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111318;
    display: none;
  }
  #status {
    position: absolute;
    right: 10px; bottom: 10px;
    background: rgba(0,0,0,.7);
    color: #ffd479;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    display: none;
  }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="tab-new" title="Neuer Tab">+</button>
  </div>
  <div id="toolbar">
    <button class="btn" id="back" title="Zurück">←</button>
    <button class="btn" id="forward" title="Vor">→</button>
    <button class="btn" id="reload" title="Neu laden">⟳</button>
    <input id="urlbar" type="text" placeholder="Adresse eingeben…" autocomplete="off" spellcheck="false">
    <button class="btn" id="open-ext" title="Im rumahl-Desktop öffnen">⤢</button>
  </div>
  <div id="surface-wrap">
    <video id="surface-video" autoplay playsinline muted></video>
    <canvas id="surface" tabindex="0"></canvas>
    <div id="status"></div>
  </div>
<script>
(() => {
  'use strict'
  const VW = 1280, VH = 800
  const canvas = document.getElementById('surface')
  const ctx = canvas.getContext('2d')
  const videoEl = document.getElementById('surface-video')
  const urlbar = document.getElementById('urlbar')
  const tabsEl = document.getElementById('tabs')
  const statusEl = document.getElementById('status')
  const backBtn = document.getElementById('back')
  const forwardBtn = document.getElementById('forward')
  const reloadBtn = document.getElementById('reload')

  let ws = null
  let tabs = []
  let activeTab = null
  let nav = { url: '', title: '', canGoBack: false, canGoForward: false }
  let frameReady = false
  let reconnectTimer = null
  let pc = null
  let frameWatchdog = null

  // WS endpoint: inside the app-runner iframe the UI is served through
  // the same-origin app proxy, so the socket must go through the proxy
  // tunnel as well (`/api/apps/<id>/proxy/ws`). Direct service access
  // (dev) uses `/ws`.
  const proxyMatch = location.pathname.match(/^\/api\/apps\/([^/]+)\/proxy\//)
  const wsPath = proxyMatch
    ? `/api/apps/${encodeURIComponent(proxyMatch[1])}/proxy/ws`
    : '/ws'
  const wsUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + wsPath

  function status(text, ms = 2500) {
    statusEl.textContent = text
    statusEl.style.display = text ? 'block' : 'none'
    if (text) setTimeout(() => { statusEl.style.display = 'none' }, ms)
  }

  function connect() {
    ws = new WebSocket(wsUrl)
    ws.onopen = () => { status('Verbunden', 1200); frameReady = false; startWebRTC() }
    ws.onclose = () => {
      status('Verbindung verloren — versuche neu…', 4000)
      if (pc) { pc.close(); pc = null }
      videoEl.style.display = 'none'
      canvas.style.display = 'block'
      clearTimeout(reconnectTimer)
      reconnectTimer = setTimeout(connect, 2000)
    }
    ws.onerror = () => ws.close()
    ws.onmessage = (e) => {
      let msg
      try { msg = JSON.parse(e.data) } catch { return }
      switch (msg.type) {
        case 'webrtc-answer':
          if (pc) pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp }).catch(() => {})
          break
        case 'ice':
          if (pc && msg.candidate) pc.addIceCandidate({ candidate: msg.candidate }).catch(() => {})
          break
        case 'webrtc-error':
          status('WebRTC: ' + (msg.message || 'Fehler'), 4000)
          break
        case 'frame':
          if (msg.tab !== activeTab) return
          // Frames arrived: cancel the no-frame watchdog and draw.
          if (frameWatchdog) { clearTimeout(frameWatchdog); frameWatchdog = null }
          const img = new Image()
          img.onload = () => {
            canvas.width = img.width
            canvas.height = img.height
            ctx.drawImage(img, 0, 0)
            frameReady = true
          }
          img.src = 'data:image/jpeg;base64,' + msg.data
          break
        case 'nav':
          if (msg.tab !== activeTab) return
          nav = msg
          if (!urlbar.matches(':focus')) urlbar.value = msg.url
          document.title = (msg.title || msg.url || 'rumahl Browser') + ' — rumahl Browser'
          backBtn.disabled = !msg.canGoBack
          forwardBtn.disabled = !msg.canGoForward
          break
        case 'tabs':
          tabs = msg.tabs
          activeTab = msg.active
          renderTabs()
          break
      }
    }
  }

  function renderTabs() {
    tabsEl.innerHTML = ''
    for (const tab of tabs) {
      const el = document.createElement('div')
      el.className = 'tab' + (tab.id === activeTab ? ' active' : '')
      const title = document.createElement('span')
      title.className = 't-title'
      title.textContent = tab.title || tab.url || 'Neuer Tab'
      title.title = tab.url
      const close = document.createElement('button')
      close.className = 't-close'
      close.textContent = '×'
      close.onclick = (e) => { e.stopPropagation(); send({ type: 'tab-close', id: tab.id }) }
      el.appendChild(title)
      el.appendChild(close)
      el.onclick = () => send({ type: 'tab-activate', id: tab.id })
      tabsEl.appendChild(el)
    }
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj))
  }

  // ── WebRTC: VP8 stream from the GStreamer session (canvas fallback) ──
  async function startWebRTC() {
    try {
      if (pc) { pc.close(); pc = null }
      pc = new RTCPeerConnection({ iceServers: [] })
      pc.addTransceiver('video', { direction: 'recvonly' })
      pc.ontrack = (e) => {
        videoEl.srcObject = e.streams[0]
        videoEl.style.display = 'block'
        canvas.style.display = 'none'
        status('WebRTC aktiv', 1500)
      }
      pc.onicecandidate = (e) => {
        if (e.candidate) send({ type: 'ice', candidate: e.candidate.candidate })
      }
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      send({ type: 'webrtc-offer', sdp: offer.sdp })
      // If no track arrives within 8s, fall back to the canvas stream.
      setTimeout(() => {
        if (!videoEl.srcObject) {
          pc.close(); pc = null
          videoEl.style.display = 'none'
          canvas.style.display = 'block'
          status('WebRTC nicht verfügbar — Canvas-Modus', 3000)
          // If no canvas frame arrives shortly after, the WS relay is
          // dropping the large frames (Vite dev proxy) - point the user
          // at the direct backend route which relays them fine.
          frameWatchdog = setTimeout(() => {
            if (!frameReady) {
              status('Keine Frames empfangen — öffne die App direkt über http://127.0.0.1:3001/app/rumahl-browser (Vite-Proxy leitet große Frames nicht weiter)', 15000)
            }
          }, 5000)
        }
      }, 8000)
    } catch (err) {
      status('WebRTC-Fehler: ' + err.message, 3000)
      pc = null
    }
  }

  // ── Input: canvas coordinates → viewport coordinates ──
  function toViewport(e) {
    const rect = canvas.getBoundingClientRect()
    return {
      x: (e.clientX - rect.left) / rect.width * VW,
      y: (e.clientY - rect.top) / rect.height * VH,
    }
  }

  canvas.addEventListener('mousedown', (e) => {
    canvas.focus()
    const p = toViewport(e)
    send({ type: 'input', kind: 'mouse', event: 'down', x: p.x, y: p.y, button: e.button === 2 ? 'right' : 'left' })
  })
  canvas.addEventListener('mouseup', (e) => {
    const p = toViewport(e)
    send({ type: 'input', kind: 'mouse', event: 'up', x: p.x, y: p.y, button: e.button === 2 ? 'right' : 'left' })
  })
  canvas.addEventListener('mousemove', (e) => {
    const p = toViewport(e)
    send({ type: 'input', kind: 'mouse', event: 'move', x: p.x, y: p.y })
  })
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault()
    send({ type: 'input', kind: 'wheel', deltaX: e.deltaX, deltaY: e.deltaY })
  }, { passive: false })
  canvas.addEventListener('contextmenu', (e) => e.preventDefault())

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === urlbar) {
      if (e.key === 'Enter') {
        navigate(urlbar.value)
        urlbar.blur()
      }
      return
    }
    if (e.ctrlKey || e.metaKey) {
      if (e.key.toLowerCase() === 'l') { e.preventDefault(); urlbar.focus(); urlbar.select(); return }
      if (e.key.toLowerCase() === 'r') { e.preventDefault(); send({ type: 'reload' }); return }
      if (e.key.toLowerCase() === 't') { e.preventDefault(); send({ type: 'tab-new', url: 'about:blank' }); return }
    }
    e.preventDefault()
    const text = e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey ? e.key : undefined
    send({ type: 'input', kind: 'key', event: 'down', key: e.key, code: e.code, text })
  })
  document.addEventListener('keyup', (e) => {
    if (document.activeElement === urlbar) return
    if (e.ctrlKey || e.metaKey) return
    send({ type: 'input', kind: 'key', event: 'up', key: e.key, code: e.code })
  })

  function navigate(raw) {
    let url = raw.trim()
    if (!url) return
    if (!/^[a-z]+:\/\//i.test(url) && !url.startsWith('about:')) url = 'https://' + url
    urlbar.value = url
    send({ type: 'navigate', url })
  }

  backBtn.onclick = () => send({ type: 'back' })
  forwardBtn.onclick = () => send({ type: 'forward' })
  reloadBtn.onclick = () => send({ type: 'reload' })
  document.getElementById('tab-new').onclick = () => send({ type: 'tab-new', url: 'about:blank' })
  document.getElementById('open-ext').onclick = () => {
    if (nav.url) window.open(nav.url, '_blank', 'noopener')
  }

  connect()
})()
</script>
</body>
</html>
