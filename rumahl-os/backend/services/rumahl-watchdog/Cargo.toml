[package]
name = "rumahl-watchdog"
version = "0.1.0"
edition = "2021"
description = "rumahl Watchdog – health monitoring and failover coordination for the rumahl ecosystem"

[dependencies]
rumahl-shared-heartbeat = { path = "../../shared/rumahl-shared-heartbeat" }
rumahl-shared-config = { path = "../../shared/rumahl-shared-config" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"], optional = true }
sysinfo = "0.30"
