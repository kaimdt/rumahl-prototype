[package]
name = "rumahl-cli"
version = "0.1.0"
edition = "2021"
description = "rumahl CLI – command-line interface for controlling rumahl OS and services"
# Disable auto-discovery so cargo doesn't claim src/main.rs as a default
# `rumahl-cli` binary in addition to the explicit `ora` target below
# (would produce: "src/main.rs assigned to multiple bin targets").
autobins = false

[[bin]]
name = "ora"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking"] }
colored = "2.0"
tabled = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
indicatif = "0.17"
