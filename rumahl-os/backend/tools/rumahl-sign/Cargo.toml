[package]
name = "rumahl-sign"
version = "0.1.0"
edition = "2021"
description = "Build-host helper to generate Ed25519 keys and sign rumahl manifests / RAUC bundles"
publish = false

[[bin]]
name = "rumahl-sign"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
