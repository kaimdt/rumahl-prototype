[package]
name = "rumahl-dev-watch"
version = "1.0.0"
edition = "2021"
description = "rumahl Dev VM Watch – Terminal UI for build, deploy & monitoring"

[dependencies]
# Double-buffered, diff-based TUI — no flicker, low CPU. Built on crossterm.
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
notify = { version = "7" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# HTTP bridge connectivity (cross-platform: rustls, no OpenSSL needed)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
