[package]
name = "rumahl-verify"
version = "0.1.0"
edition = "2021"
description = "Boot-time integrity verification for rumahl OS"
publish = false

[[bin]]
name = "rumahl-verify"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "3", features = ["pem", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
