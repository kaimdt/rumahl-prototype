[package]
name = "rumahl-shared-upload"
version = "0.1.0"
edition = "2021"
description = "Safe archive extraction and atomic upload storage for rumahl"

[dependencies]
anyhow = "1.0"
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["fs"] }
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[lib]
name = "rumahl_shared_upload"
path = "src/lib.rs"
