[package]
name = "rumahl-shared"
version = "0.1.0"
edition = "2021"
description = "rumahl Shared – common types, plugin system, and utilities for the rumahl ecosystem"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"
jsonwebtoken = "9.2"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
rumahl-shared-types = { path = "../rumahl-shared-types" }
rumahl-shared-heartbeat = { path = "../rumahl-shared-heartbeat" }
rumahl-shared-config = { path = "../rumahl-shared-config" }
rumahl-shared-upload = { path = "../rumahl-shared-upload" }

[lib]
name = "rumahl_shared"
path = "src/lib.rs"
