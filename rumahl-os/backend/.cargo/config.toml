# ═══════════════════════════════════════════════════════════════════
# Cross-compilation config for rumahl OS
# ═══════════════════════════════════════════════════════════════════
# The dev-watch scripts auto-detect the cross-compiler and set
# CC_<target> and CARGO_TARGET_<target>_LINKER env vars dynamically.
# This file provides sensible build defaults.

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[registries.crates-io]
protocol = "sparse"

[net]
retry = 2
git-fetch-with-cli = true
