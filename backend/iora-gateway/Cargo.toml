[package]
name = "iora-gateway"
version = "0.1.0"
edition = "2021"
description = "IORA Gateway – sandboxed external integration gateway with email, web search, and secure data retrieval for the IORA ecosystem"

[dependencies]
iora-shared = { path = "../iora-shared" }
tokio = { version = "1", features = ["full", "process"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client with security features
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Email
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }

# Content validation and sanitization
regex = "1.10"
url = "2.5"
html5ever = "0.27"
ammonia = "4.0"  # HTML sanitization

# Cryptographic verification
sha2 = "0.10"
hex = "0.4"
ring = "0.17"

# Sandboxing (process isolation)
nix = { version = "0.29", features = ["process", "signal"] }

# Rate limiting
governor = "0.6"
