<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming soon — ORA</title>
<meta name="description" content="ORA, the AI assistant for your home, is coming soon to rumahl OS.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1237 308'%3E%3Cpath fill='%232ea0f7' d='M22 284 Q18 284 18 280 V171 C18 119 52 85 103 85 H120 Q124 85 124 89 V125 Q124 129 120 129 H107 C79 129 61 146 61 174 V280 Q61 284 57 284 Z'/%3E%3C/svg%3E">
<style>
  /* Fully standalone: no external fonts, no CDN, no JavaScript, no other files. */
  :root {
    --bg: #06060a;
    --card: rgba(16, 16, 24, 0.74);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8ecf4;
    --text-dim: #8b93a7;
    --primary: #2ea0f7;
    --teal: #38e1c4;
    --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Aurora background — pure CSS */
  .aurora { position: fixed; inset: 0; pointer-events: none; }
  .aurora::before, .aurora::after {
    content: ""; position: absolute; border-radius: 9999px; filter: blur(90px);
  }
  .aurora::before {
    width: 480px; height: 480px; left: 50%; top: -220px; transform: translateX(-50%);
    background: rgba(46, 160, 247, 0.16);
    animation: drift 12s ease-in-out infinite alternate;
  }
  .aurora::after {
    width: 380px; height: 380px; right: -120px; bottom: -140px;
    background: rgba(167, 139, 250, 0.08);
    animation: drift2 16s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(26px); } }
  @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-34px, -22px); } }

  .grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(46, 160, 247, 0.13) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 15%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 15%, transparent 75%);
  }

  .card {
    position: relative;
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 56px 40px 44px;
    text-align: center;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* Logo — block-level so the badge lands BELOW it, centered */
  .logo { display: block; text-align: center; margin-bottom: 26px; }
  .logo svg { height: 34px; width: auto; animation: logo-glow 3.5s ease-in-out infinite; }
  @keyframes logo-glow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(46, 160, 247, 0.25)); }
    50%      { filter: drop-shadow(0 0 22px rgba(46, 160, 247, 0.5)); }
  }

  /* The O mark (ORA) — glowing, with expanding rings (pure CSS) */
  .mark { position: relative; width: 96px; height: 96px; margin: 0 auto 30px; }
  .mark svg { width: 100%; height: 100%; color: var(--primary); animation: glow 2.2s ease-in-out infinite; }
  .mark .ring {
    position: absolute; inset: -6px; border-radius: 9999px;
    border: 2px solid rgba(46, 160, 247, 0.55);
    animation: pulse 2.4s ease-out infinite;
  }
  .mark .ring.r2 { animation-delay: 0.8s; }
  .mark .ring.r3 { animation-delay: 1.6s; }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(46, 160, 247, 0.35)); }
    50%      { filter: drop-shadow(0 0 26px rgba(46, 160, 247, 0.6)); }
  }
  @keyframes pulse {
    0%   { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border);
    background: rgba(46, 160, 247, 0.14);
    color: var(--primary);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 16px; border-radius: 999px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  /* Flowing gradient headline word */
  .grad {
    background-image: linear-gradient(90deg, var(--primary), var(--teal), var(--purple), var(--primary));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

  .desc {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.65;
    max-width: 400px;
    margin: 0 auto 26px;
  }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips span {
    font-size: 12px; font-weight: 500;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 13px;
    background: rgba(255, 255, 255, 0.02);
  }
  .chips span b { color: var(--text); font-weight: 600; }

  footer { margin-top: 28px; font-size: 12px; color: rgba(139, 147, 167, 0.65); }

  @media (max-width: 480px) { .card { padding: 40px 24px 32px; } }
  @media (prefers-reduced-motion: reduce) {
    .aurora::before, .aurora::after, .card, .logo svg, .mark svg, .mark .ring, .grad { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>

  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 54 53" fill="currentColor">
        <path d="M26.86 52.292c15.3 0 26.86-11.288 26.86-26.18C53.72 11.22 42.228 0 26.86 0 11.492 0 0 11.22 0 26.112c0 14.892 11.56 26.18 26.86 26.18zm0-9.52c-9.248 0-16.32-6.868-16.32-16.66 0-9.792 7.072-16.592 16.32-16.592 9.248 0 16.32 6.8 16.32 16.592 0 9.792-7.072 16.66-16.32 16.66z"/>
      </svg>
      <span class="ring"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
    </div>

    

    <div class="logo" aria-label="ORA">
      <svg viewBox="0 0 145 53" fill="currentColor" color="#e8ecf4" role="img" aria-hidden="true">
        <path d="M26.86 52.292c15.3 0 26.86-11.288 26.86-26.18C53.72 11.22 42.228 0 26.86 0 11.492 0 0 11.22 0 26.112c0 14.892 11.56 26.18 26.86 26.18zm0-9.52c-9.248 0-16.32-6.868-16.32-16.66 0-9.792 7.072-16.592 16.32-16.592 9.248 0 16.32 6.8 16.32 16.592 0 9.792-7.072 16.66-16.32 16.66zm29.24 8.704h10.54v-18.36h8.908l10.268 18.36h11.832l-11.56-20.196c5.372-2.448 8.772-7.344 8.772-14.28 0-10.608-7.48-16.184-17.952-16.184h-20.808zm10.54-27.54V9.996h10.336c4.42 0 7.344 2.788 7.344 7.004 0 4.148-2.924 6.936-7.344 6.936zM126.82.816h-13.94L95.608 51.476h11.152l3.4-10.336h19.38l3.4 10.336h11.152zm-13.668 31.144 6.732-20.536 6.664 20.536z"/>
      </svg>
    </div>

    <div class="badge">ORA &middot; Coming soon</div>

    <h1>Something <span class="grad">intelligent</span> is on its way</h1>
    <p class="desc">ORA is the AI assistant built into rumahl OS — natural language, voice and context, 100% local and private. This page will be ready shortly. Stay tuned.</p>

    <div class="chips">
      <span><b>Local-first</b></span>
      <span><b>Private by design</b></span>
      <span><b>AI-native</b></span>
    </div>
  </div>

  <footer>&copy; 2026 rumahl. All rights reserved.</footer>
</body>
</html>
