[package]
name = "iora-db-manager"
version = "1.0.0"
edition = "2021"
authors = ["IORA Team"]
description = "PostgreSQL database manager with per-service users, password rotation, and security"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[dependencies.iora-shared]
path = "../../shared/iora-shared"
