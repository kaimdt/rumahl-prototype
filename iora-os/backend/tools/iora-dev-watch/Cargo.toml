[package]
name = "iora-dev-watch"
version = "1.0.0"
edition = "2021"
description = "IORA Dev VM Watch – Terminal UI for build, deploy & monitoring"

[dependencies]
flywheel-compositor = "0.1"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
notify = { version = "7" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
