[package]
name = "iora-dev-watch"
version = "1.0.0"
edition = "2021"
description = "IORA Dev VM Watch – Terminal UI for build, deploy & monitoring"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
