[package]
name = "iora-dev-watch"
version = "1.0.0"
edition = "2021"
description = "IORA Dev VM Watch – Terminal UI for build, deploy & monitoring"

[dependencies]
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
notify = { version = "7" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# HTTP bridge connectivity (cross-platform: rustls, no OpenSSL needed)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
