[package]
name = "iora-domain-validator"
version = "0.1.0"
edition = "2021"
description = "IORA Domain Validator – Domain whitelist enforcement and network access control"

[[bin]]
name = "iora-domain-validator"
path = "src/main.rs"

[dependencies]
iora-shared = { path = "../../shared/iora-shared" }
tokio = { version = "1", features = ["full", "process", "signal"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Domain validation
regex = "1.10"
url = "2.5"
trust-dns-resolver = "0.23"

# Network filtering
ipnetwork = "0.20"
