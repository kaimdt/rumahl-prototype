[package]
name = "iora-security"
version = "0.1.0"
edition = "2021"
description = "IORA Security – comprehensive security monitoring, encrypted audit logging, and intrusion detection for the IORA ecosystem"

[dependencies]
iora-shared-heartbeat = { path = "../../shared/iora-shared-heartbeat" }
iora-shared-config = { path = "../../shared/iora-shared-config" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# Network analysis
ipnetwork = "0.20"

# HTTP client for monitoring
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
