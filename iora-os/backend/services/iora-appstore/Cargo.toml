[package]
name = "iora-appstore"
version = "0.1.0"
edition = "2021"
description = "IORA App Store - marketplace for IORA apps and plugins"

[dependencies]
iora-shared = { path = "../../shared/iora-shared" }
iora-shared-heartbeat = { path = "../../shared/iora-shared-heartbeat" }
iora-shared-config = { path = "../../shared/iora-shared-config" }

actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = "0.6"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
