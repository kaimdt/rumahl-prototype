[package]
name = "iora-connector"
version = "0.1.0"
edition = "2021"
description = "IORA Connector – datacenter relay that exposes selected local IORA services publicly via encrypted VPN tunnels"

[dependencies]
iora-shared = { path = "../../shared/iora-shared" }
tokio = { version = "1", features = ["full", "process", "signal"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# HTTP client for proxying to local IORA
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# WebSocket relay
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Cryptography for tunnel auth
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
x25519-dalek = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.25"

# Rate limiting & DDoS protection
governor = "0.6"

# Authentication
jsonwebtoken = "9.2"

# WireGuard config generation
base64 = "0.22"

# DNS resolution
trust-dns-resolver = "0.23"

# System info
sysinfo = "0.31"
