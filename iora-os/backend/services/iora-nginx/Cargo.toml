[package]
name = "iora-nginx"
version = "0.1.0"
edition = "2021"
description = "IORA NGINX – Reverse proxy service for all web traffic in the IORA ecosystem"

[[bin]]
name = "iora-nginx"
path = "src/main.rs"

[dependencies]
iora-shared = { path = "../../shared/iora-shared" }
tokio = { version = "1", features = ["full", "process", "signal"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP reverse proxy
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.0"
http-body-util = "0.1"

# NGINX process management
nix = { version = "0.29", features = ["process", "signal"] }

# Configuration templating
tera = "1.19"

# Database for tracking app routes
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
