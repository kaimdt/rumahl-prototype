[package]
name = "iora-runtime-identity"
version = "0.1.0"
edition = "2021"
description = "Read-only runtime event identity resolver for ORA OS"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
iora-shared-config = { path = "../../shared/iora-shared-config" }
iora-shared-heartbeat = { path = "../../shared/iora-shared-heartbeat" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
