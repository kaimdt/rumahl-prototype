[package]
name = "iora-browserd"
version = "0.1.0"
edition = "2021"
description = "ORA Browser service — global headless-Chromium browser engine (CDP) for the ORA Browser app and other ORA apps"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
anyhow = "1"
reqwest = { version = "0.11", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# GStreamer (system libraries, gst-rs bindings) — WebRTC render pipeline:
# appsrc(jpeg) -> jpegdec -> vp8enc -> rtpvp8pay -> webrtcbin (sendonly).
gstreamer = { version = "0.22", features = ["v1_22"] }
gstreamer-app = { version = "0.22", features = ["v1_22"] }
gstreamer-sdp = { version = "0.22", features = ["v1_22"] }
gstreamer-webrtc = { version = "0.22", features = ["v1_22"] }
glib = "0.19"
base64 = "0.22"
