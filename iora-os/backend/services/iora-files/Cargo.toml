[package]
name = "iora-files"
version = "0.1.0"
edition = "2021"
description = "IORA Files – secure file sharing, upload/download, share links, and collaborative file management for the IORA ecosystem"

[dependencies]
iora-shared = { path = "../../shared/iora-shared" }
tokio = { version = "1", features = ["full", "fs"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Authentication
jsonwebtoken = "10.4"

# File handling
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }

# Rate limiting
governor = "0.6"

# Zip support for folder downloads
async_zip = { version = "0.0.17", features = ["tokio", "deflate"] }
rand = "0.8"
