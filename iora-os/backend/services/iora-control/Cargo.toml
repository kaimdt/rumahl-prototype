[package]
name = "iora-control"
version = "0.1.0"
edition = "2021"
description = "IORA Control – administrative control panel backend for the IORA ecosystem"

[dependencies]
iora-shared-heartbeat = { path = "../../shared/iora-shared-heartbeat" }
iora-shared-config = { path = "../../shared/iora-shared-config" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenv = "0.15"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
jsonwebtoken = "10.4"
sysinfo = "0.30"
tower = { version = "0.5.3", default-features = false }
governor = "0.10.4"
tower_governor = "0.8.0"
axum-extra = { version = "0.12.6", default-features = false, features = ["tracing"] }
dashmap = "6.2.1"
parking_lot = "0.12.5"
futures-util = "0.3.32"
tokio-stream = "0.1.18"
