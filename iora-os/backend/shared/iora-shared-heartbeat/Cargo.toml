[package]
name = "iora-shared-heartbeat"
version = "0.1.0"
edition = "2021"
description = "IORA service heartbeat client and health reporting"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
iora-shared-types = { path = "../iora-shared-types" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"

[lib]
name = "iora_shared_heartbeat"
path = "src/lib.rs"
