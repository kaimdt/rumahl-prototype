[package]
name = "iora-developer-app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-web-lab = "0.20"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
futures-util = "0.3"
base64 = "0.21"
async-stream = "0.3"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
rand = "0.8"

# API documentation
# NOTE: actix_extras removed — workspace-wide feature unification with iora-home (axum_extras)
# caused utoipa-gen E0119 (duplicate ArgumentResolver impls). We don't use IntoParams here.
utoipa = { version = "5" }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }
