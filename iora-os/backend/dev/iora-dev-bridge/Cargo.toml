[package]
name = "iora-dev-bridge"
version = "0.1.0"
edition = "2021"
description = "On-device hot-reload bridge for the IORA Developer App and the iora-dev-deploy CLI (dev images only)"
publish = false

[[bin]]
name = "iora-dev-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "process", "time", "signal"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
hex = "0.4"
futures-util = "0.3"
mdns-sd = "0.11"
gethostname = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
# Direct PostgreSQL access for /dev/db/* endpoints (full DB control on
# dev images). Same major version as the rest of the workspace.
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
