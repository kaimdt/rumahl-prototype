[package]
name = "iora-dev-deploy"
version = "0.1.0"
edition = "2021"
description = "Developer-machine companion: discover IORA OS Dev devices, recompile crates, and hot-deploy binaries"
publish = false

[[bin]]
name = "iora-dev-deploy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "time", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
mdns-sd = "0.11"
sha2 = "0.10"
hex = "0.4"
notify = "6"
notify-debouncer-mini = "0.4"
crossterm = "0.27"
dirs = "5"
futures-util = "0.3"
indicatif = "0.17"
colored = "2"

[workspace]
# Standalone workspace — this CLI never joins the on-device backend workspace.
