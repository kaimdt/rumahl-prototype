<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IORA Dev Dashboard</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --green:#3fb950; --red:#f85149; --yellow:#d2991d; --cyan:#58a6ff; --text:#c9d1d9; --dim:#8b949e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace; padding:24px; }
  h1 { font-size:18px; color:var(--cyan); margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { font-size:13px; color:var(--dim); text-transform:uppercase; margin-bottom:12px; letter-spacing:0.5px; }
  .status { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; }
  .status.up { background:var(--green); }
  .status.down { background:var(--red); }
  .status.building { background:var(--yellow); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px; border-bottom:1px solid rgba(48,54,61,0.5); }
  .row:last-child { border:none; }
  .row .label { color:var(--dim); }
  .row .value { font-weight:600; }
  .row .value.ok { color:var(--green); }
  .row .value.err { color:var(--red); }
  .row .value.warn { color:var(--yellow); }
  #log { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:12px; height:300px; overflow-y:auto; font-size:11px; line-height:1.5; white-space:pre-wrap; }
  #log .ts { color:var(--dim); }
  #log .info { color:var(--text); }
  #log .ok { color:var(--green); }
  #log .err { color:var(--red); }
  button { background:var(--cyan); color:#000; border:none; border-radius:6px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; margin-right:8px; }
  button:hover { opacity:0.85; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .actions { margin:16px 0; display:flex; gap:8px; }
  .refresh { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<h1>IORA Dev Dashboard</h1>
<div class="sub">Auto-refreshes every 3s | <span id="lastRefresh">--</span></div>

<div class="actions">
  <button onclick="triggerBuild()" id="btnBuild">Build All Services</button>
  <button onclick="triggerRestart()" id="btnRestart">Restart Services</button>
  <button onclick="openSSH()">SSH into VM</button>
</div>

<div class="grid">
  <div class="card">
    <h2>VM Status</h2>
    <div class="row"><span class="label">QEMU</span><span class="value" id="vmRunning">checking...</span></div>
    <div class="row"><span class="label">SSH (port <span id="sshPort">2222</span>)</span><span class="value" id="sshStatus">checking...</span></div>
    <div class="row"><span class="label">Uptime</span><span class="value" id="vmUptime">--</span></div>
  </div>

  <div class="card">
    <h2>IORA Services</h2>
    <div id="services"></div>
  </div>

  <div class="card">
    <h2>Ports</h2>
    <div class="row"><span class="label">Dashboard</span><span class="value"><a href="http://localhost:8126" target="_blank" style="color:var(--cyan)">:8126</a> <span id="port8126" class="status down"></span></span></div>
    <div class="row"><span class="label">Dev Bridge</span><span class="value"><span id="port8101" class="status down"></span> :8101</span></div>
    <div class="row"><span class="label">Frontend</span><span class="value"><a href="http://localhost:5173" target="_blank" style="color:var(--cyan)">:5173</a></span></div>
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <h2>Build Log</h2>
  <div id="log"><span class="ts">--</span> <span class="info">Waiting for first status update...</span></div>
</div>

<script>
const HOST = window.location.hostname;
const VM_SSH = 2222;
const SERVICES = ['iora-core','iora-home','iora-control','iora-assist','iora-secrets',
  'iora-watchdog','iora-security','iora-gateway','iora-supervisor','iora-dev-bridge',
  'iora-api','iora-appstore','iora-backup','iora-connector','iora-files'];

function status(port, cb) {
  fetch(`http://${HOST}:${port}`, {mode:'no-cors'}).then(r => cb(true)).catch(() => cb(false));
}

function updateAll() {
  document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();

  // SSH
  fetch(`http://${HOST}:${VM_SSH}`, {mode:'no-cors'}).then(() => {
    document.getElementById('sshStatus').innerHTML = '<span class="status up"></span> reachable';
    document.getElementById('sshStatus').className = 'value ok';
  }).catch(() => {
    document.getElementById('sshStatus').innerHTML = '<span class="status down"></span> down';
    document.getElementById('sshStatus').className = 'value err';
  });

  // Port 8126
  status(8126, up => document.getElementById('port8126').className = 'status ' + (up ? 'up' : 'down'));

  // Port 8101
  status(8101, up => document.getElementById('port8101').className = 'status ' + (up ? 'up' : 'down'));

  // VM running
  document.getElementById('vmRunning').innerHTML = '<span class="status up"></span> running';
  document.getElementById('vmRunning').className = 'value ok';

  // Services
  fetch(`http://${HOST}:8101/dev/services`)
    .then(r => r.json())
    .then(data => {
      let html = '';
      (data.services || SERVICES).forEach(s => {
        const name = typeof s === 'string' ? s : s.name || s;
        const up = typeof s === 'object' ? s.status === 'active' : data[name];
        html += `<div class="row"><span class="label">${name}</span><span class="value ${up ? 'ok' : 'err'}"><span class="status ${up ? 'up' : 'down'}"></span>${up ? 'running' : 'stopped'}</span></div>`;
      });
      document.getElementById('services').innerHTML = html || '<div class="row"><span class="label">Dev-bridge not reachable</span></div>';
    })
    .catch(() => {
      let html = '';
      SERVICES.forEach(s => {
        html += `<div class="row"><span class="label">${s}</span><span class="value err"><span class="status down"></span>unknown</span></div>`;
      });
      document.getElementById('services').innerHTML = html;
    });
}

function triggerBuild() {
  const btn = document.getElementById('btnBuild');
  btn.disabled = true;
  btn.textContent = 'Building...';
  const log = document.getElementById('log');
  log.innerHTML += '\n<span class="ts">' + new Date().toLocaleTimeString() + '</span> <span class="info">Build triggered via dashboard...</span>';
  fetch(`http://${HOST}:8101/dev/build`, {method:'POST'})
    .then(r => r.text())
    .then(msg => {
      log.innerHTML += '\n<span class="ok">' + msg + '</span>';
      btn.textContent = 'Build Started';
    })
    .catch(e => {
      log.innerHTML += '\n<span class="err">Build failed: dev-bridge not reachable. Use SSH.</span>';
      btn.textContent = 'Build All Services';
      btn.disabled = false;
    });
}

function triggerRestart() {
  fetch(`http://${HOST}:8101/dev/restart`, {method:'POST'})
    .catch(() => {});
}

function openSSH() {
  window.open('ssh://iora@localhost:' + VM_SSH, '_blank');
}

updateAll();
setInterval(updateAll, 3000);
</script>
</body>
</html>
