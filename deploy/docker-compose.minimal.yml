# ============================================================================
# rumahl – Docker Compose (Minimal)
# ============================================================================
# Nur die kritischen Kern-Dienste: Postgres + Core + Secrets + Home.
# Für Raspberry Pi, low-resource VMs oder schnelles lokales Testen.
#
# Verwendung:
#   docker compose -f docker-compose.minimal.yml up -d
# ============================================================================

version: '3.8'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rumahl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rumahl_home}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - rumahl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── rumahl-core ──────────────────────────────────────────────────────────
  rumahl-core:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-core
    image: ora/core:latest
    container_name: rumahl-core
    ports:
      - "${CORE_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_core"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ── rumahl-secrets ───────────────────────────────────────────────────────
  rumahl-secrets:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-secrets
    image: ora/secrets:latest
    container_name: rumahl-secrets
    ports:
      - "${SECRETS_PORT:-8093}:8093"
    environment:
      PORT: "8093"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_secrets"
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-changeme}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ── rumahl-home ──────────────────────────────────────────────────────────
  rumahl-home:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-home
    image: ora/home:latest
    container_name: rumahl-home
    ports:
      - "${HOME_PORT:-8126}:8126"
    environment:
      PORT: "8126"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_home"
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rumahl-core:
        condition: service_started

  # ── Optional: STT (faster-whisper) ─────────────────────────────────────
  rumahl-stt:
    build:
      context: ../rumahl-os/backend/services/rumahl-stt
    image: ora/stt:latest
    container_name: rumahl-stt
    ports:
      - "${STT_PORT:-8110}:8110"
    environment:
      RUMAHL_STT_PORT: "8110"
      RUMAHL_STT_MODEL: ${RUMAHL_STT_MODEL:-base}
      RUMAHL_STT_DEVICE: ${RUMAHL_STT_DEVICE:-cpu}
    networks:
      - rumahl-network
    restart: unless-stopped
    profiles:
      - voice

  # ── Optional: TTS (Kokoro ONNX) ────────────────────────────────────────
  rumahl-tts:
    build:
      context: ../rumahl-os/backend/services/rumahl-tts
    image: ora/tts:latest
    container_name: rumahl-tts
    ports:
      - "${TTS_PORT:-8111}:8111"
    environment:
      RUMAHL_TTS_PORT: "8111"
      RUMAHL_TTS_VOICE: ${RUMAHL_TTS_VOICE:-af_nicole}
      RUMAHL_TTS_LANG: ${RUMAHL_TTS_LANG:-en-us}
      RUMAHL_TTS_MODEL_PATH: /models/kokoro-v1.0.onnx
      RUMAHL_TTS_VOICES_PATH: /models/voices-v1.0.bin
    volumes:
      - tts_models:/models
    networks:
      - rumahl-network
    restart: unless-stopped
    profiles:
      - voice

networks:
  rumahl-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  tts_models:
    driver: local
