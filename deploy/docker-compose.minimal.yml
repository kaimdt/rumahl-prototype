# ============================================================================
# IORA – Docker Compose (Minimal)
# ============================================================================
# Nur die kritischen Kern-Dienste: Postgres + Core + Secrets + Home.
# Für Raspberry Pi, low-resource VMs oder schnelles lokales Testen.
#
# Verwendung:
#   docker compose -f docker-compose.minimal.yml up -d
# ============================================================================

version: '3.8'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: iora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iora_home}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - iora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── iora-core ──────────────────────────────────────────────────────────
  iora-core:
    build:
      context: ../iora-os/backend
      dockerfile: Dockerfile
      target: iora-core
    image: iora/core:latest
    container_name: iora-core
    ports:
      - "${CORE_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_core"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ── iora-secrets ───────────────────────────────────────────────────────
  iora-secrets:
    build:
      context: ../iora-os/backend
      dockerfile: Dockerfile
      target: iora-secrets
    image: iora/secrets:latest
    container_name: iora-secrets
    ports:
      - "${SECRETS_PORT:-8093}:8093"
    environment:
      PORT: "8093"
      DATABASE_URL: "postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_secrets"
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-changeme}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ── iora-home ──────────────────────────────────────────────────────────
  iora-home:
    build:
      context: ../iora-os/backend
      dockerfile: Dockerfile
      target: iora-home
    image: iora/home:latest
    container_name: iora-home
    ports:
      - "${HOME_PORT:-8126}:8126"
    environment:
      PORT: "8126"
      DATABASE_URL: "postgres://${POSTGRES_USER:-iora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/iora_home"
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      IORA_CORE_URL: "http://iora-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - iora-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      iora-core:
        condition: service_started

  # ── Optional: STT (faster-whisper) ─────────────────────────────────────
  iora-stt:
    build:
      context: ../iora-os/backend/services/iora-stt
    image: iora/stt:latest
    container_name: iora-stt
    ports:
      - "${STT_PORT:-8110}:8110"
    environment:
      IORA_STT_PORT: "8110"
      IORA_STT_MODEL: ${IORA_STT_MODEL:-base}
      IORA_STT_DEVICE: ${IORA_STT_DEVICE:-cpu}
    networks:
      - iora-network
    restart: unless-stopped
    profiles:
      - voice

  # ── Optional: TTS (Kokoro ONNX) ────────────────────────────────────────
  iora-tts:
    build:
      context: ../iora-os/backend/services/iora-tts
    image: iora/tts:latest
    container_name: iora-tts
    ports:
      - "${TTS_PORT:-8111}:8111"
    environment:
      IORA_TTS_PORT: "8111"
      IORA_TTS_VOICE: ${IORA_TTS_VOICE:-af_nicole}
      IORA_TTS_LANG: ${IORA_TTS_LANG:-en-us}
      IORA_TTS_MODEL_PATH: /models/kokoro-v1.0.onnx
      IORA_TTS_VOICES_PATH: /models/voices-v1.0.bin
    volumes:
      - tts_models:/models
    networks:
      - iora-network
    restart: unless-stopped
    profiles:
      - voice

networks:
  iora-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  tts_models:
    driver: local
