# ============================================================================
# rumahl – Docker Compose (Full Stack)
# ============================================================================
# Alle rumahl-Dienste für Entwicklung, Test und Fremdinstallation.
#
# PRODUKTION: rumahl OS verwenden (buildroot-basiertes Image)
# Dieses Compose-File ist für Nicht-rumahl-OS-Umgebungen gedacht.
#
# Verwendung:
#   cp .env.example .env          # Umgebungsvariablen anpassen
#   docker compose up -d          # Alle Dienste starten
#   docker compose up -d postgres rumahl-core rumahl-home  # Nur Kern-Dienste
#   docker compose down           # Alle Dienste stoppen
#   docker compose logs -f        # Live-Logs
#
# Build-Kontext: deploy/ → ../rumahl-os/backend/
# ============================================================================

version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL – Zentrale Datenbank für alle rumahl-Dienste
  # ═══════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: rumahl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rumahl_home}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - rumahl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-core – Zentraler Orchestrator (Service Discovery, Plugin-Registry)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-core:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-core
    image: ora/core:latest
    container_name: rumahl-core
    ports:
      - "${CORE_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_core"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-home – Dashboard-Backend, API, Auth, Streaming (Port 8126)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-home:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-home
    image: ora/home:latest
    container_name: rumahl-home
    ports:
      - "${HOME_PORT:-8126}:8126"
    environment:
      PORT: "8126"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_home"
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rumahl-core:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-security – Security Monitoring, PostgreSQL-Verwaltung
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-security:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-security
    image: ora/security:latest
    container_name: rumahl-security
    ports:
      - "${SECURITY_PORT:-8095}:8095"
    environment:
      PORT: "8095"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_security"
      POSTGRES_ADMIN_URL: "postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres"
      SECURITY_DB_PATH: "/var/lib/ora/security.db"
      SECURITY_DB_KEY: ${SECURITY_DB_KEY:-changeme}
      AUTO_LOCKDOWN_ENABLED: "true"
      THREAT_LEVEL_THRESHOLD: "7"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - security_data:/var/lib/ora
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-watchdog – Health Monitoring
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-watchdog:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-watchdog
    image: ora/watchdog:latest
    container_name: rumahl-watchdog
    ports:
      - "${WATCHDOG_PORT:-8094}:8094"
    environment:
      PORT: "8094"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-secrets – Verschlüsselte Secrets-Verwaltung
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-secrets:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-secrets
    image: ora/secrets:latest
    container_name: rumahl-secrets
    ports:
      - "${SECRETS_PORT:-8093}:8093"
    environment:
      PORT: "8093"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_secrets"
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-changeme}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-gateway – Sandboxed externe Integrationen (E-Mail, Webhooks)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-gateway:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-gateway
    image: ora/gateway:latest
    container_name: rumahl-gateway
    ports:
      - "${GATEWAY_PORT:-8096}:8096"
    environment:
      PORT: "8096"
      GATEWAY_DB_PATH: "/var/lib/ora/gateway.db"
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ENABLE_SANDBOXING: "true"
      REQUEST_TIMEOUT_SECS: "30"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gateway_data:/var/lib/ora
    networks:
      - rumahl-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-control – Admin-Panel Backend
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-control:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-control
    image: ora/control:latest
    container_name: rumahl-control
    ports:
      - "${CONTROL_PORT:-8091}:8091"
    environment:
      PORT: "8091"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUMAHL_HOME_URL: "http://rumahl-home:8126"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core
      - rumahl-home

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-assist – AI-Assistant (rumahl)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-assist:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-assist
    image: ora/assist:latest
    container_name: rumahl-assist
    ports:
      - "${ASSIST_PORT:-8092}:8092"
    environment:
      PORT: "8092"
      ASSIST_AI_BACKEND_URL: ${ASSIST_AI_BACKEND_URL:-}
      ASSIST_AI_API_KEY: ${ASSIST_AI_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-backup – Backup & Restore
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-backup:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-backup
    image: ora/backup:latest
    container_name: rumahl-backup
    ports:
      - "${BACKUP_PORT:-8100}:8100"
    environment:
      PORT: "8100"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rumahl_backup"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: ${POSTGRES_USER:-ora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      BACKUP_DIR: "/var/lib/ora/backups"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - backup_data:/var/lib/ora/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - postgres_data:/backup-postgres:ro
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-api – API Gateway (REST + WebSocket)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-api:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-api
    image: ora/api:latest
    container_name: rumahl-api
    ports:
      - "${API_PORT:-8101}:8101"
    environment:
      PORT: "8101"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core
    profiles:
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-files – Datei-Sharing
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-files:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-files
    image: ora/files:latest
    container_name: rumahl-files
    ports:
      - "${FILES_PORT:-8102}:8102"
    environment:
      PORT: "8102"
      FILES_DATA_DIR: "/var/lib/ora/files"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - files_data:/var/lib/ora/files
    networks:
      - rumahl-network
    restart: unless-stopped
    profiles:
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-updater – Update-Manager (RAUC-Integration auf rumahl OS)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-updater:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-updater
    image: ora/updater:latest
    container_name: rumahl-updater
    ports:
      - "${UPDATER_PORT:-8103}:8103"
    environment:
      PORT: "8103"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core
    profiles:
      - rumahl-os
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-connector – Remote-Verbindung (Tailscale/ZeroTier)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-connector:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-connector
    image: ora/connector:latest
    container_name: rumahl-connector
    ports:
      - "${CONNECTOR_PORT:-8104}:8104"
    environment:
      PORT: "8104"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-core
    profiles:
      - full
      - remote

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-nginx – Reverse Proxy (nur rumahl OS)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-nginx:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-nginx
    image: ora/nginx:latest
    container_name: rumahl-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "443:443"
    environment:
      RUMAHL_HOME_URL: "http://rumahl-home:8126"
      RUMAHL_CORE_URL: "http://rumahl-core:8090"
    volumes:
      - nginx_certs:/etc/nginx/certs
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      - rumahl-home
      - rumahl-core
    profiles:
      - rumahl-os
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-network-monitor – Netzwerk-Scanner
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-network-monitor:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-network-monitor
    image: ora/network-monitor:latest
    container_name: rumahl-network-monitor
    network_mode: host
    environment:
      PORT: "${NETWORK_MONITOR_PORT:-8105}"
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    profiles:
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-supervisor – Docker-Container-Management (rumahl OS ONLY)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-supervisor:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-supervisor
    image: ora/supervisor:latest
    container_name: rumahl-supervisor
    ports:
      - "${SUPERVISOR_PORT:-8097}:8097"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - supervisor_data:/var/lib/ora
    environment:
      PORT: "8097"
      RUMAHL_OS: "true"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      rumahl-core:
        condition: service_started
    profiles:
      - rumahl-os
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-intelligence – KI-gestützte Systemanalyse (rumahl OS)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-intelligence:
    build:
      context: ../rumahl-os/backend
      dockerfile: Dockerfile
      target: rumahl-intelligence
    image: ora/intelligence:latest
    container_name: rumahl-intelligence
    ports:
      - "${INTELLIGENCE_PORT:-8099}:8099"
    volumes:
      - intelligence_data:/var/lib/ora
    environment:
      PORT: "8099"
      RUMAHL_HOME_URL: "http://rumahl-home:8126"
      CORE_URL: "http://rumahl-core:8090"
      RUMAHL_OS: "true"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - rumahl-network
    restart: unless-stopped
    depends_on:
      rumahl-core:
        condition: service_started
    profiles:
      - rumahl-os
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-stt – Speech-to-Text (faster-whisper)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-stt:
    build:
      context: ../rumahl-os/backend/services/rumahl-stt
    image: ora/stt:latest
    container_name: rumahl-stt
    ports:
      - "${STT_PORT:-8110}:8110"
    environment:
      RUMAHL_STT_PORT: "8110"
      RUMAHL_STT_MODEL: ${RUMAHL_STT_MODEL:-base}
      RUMAHL_STT_DEVICE: ${RUMAHL_STT_DEVICE:-cpu}
    networks:
      - rumahl-network
    restart: unless-stopped
    profiles:
      - voice
      - full

  # ═══════════════════════════════════════════════════════════════════════
  # rumahl-tts – Text-to-Speech (Kokoro ONNX)
  # ═══════════════════════════════════════════════════════════════════════
  rumahl-tts:
    build:
      context: ../rumahl-os/backend/services/rumahl-tts
    image: ora/tts:latest
    container_name: rumahl-tts
    ports:
      - "${TTS_PORT:-8111}:8111"
    environment:
      RUMAHL_TTS_PORT: "8111"
      RUMAHL_TTS_VOICE: ${RUMAHL_TTS_VOICE:-af_nicole}
      RUMAHL_TTS_LANG: ${RUMAHL_TTS_LANG:-en-us}
      RUMAHL_TTS_MODEL_PATH: /models/kokoro-v1.0.onnx
      RUMAHL_TTS_VOICES_PATH: /models/voices-v1.0.bin
    volumes:
      - tts_models:/models
    networks:
      - rumahl-network
    restart: unless-stopped
    profiles:
      - voice
      - full

networks:
  rumahl-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  security_data:
    driver: local
  gateway_data:
    driver: local
  backup_data:
    driver: local
  files_data:
    driver: local
  supervisor_data:
    driver: local
  intelligence_data:
    driver: local
  nginx_certs:
    driver: local
  tts_models:
    driver: local
