version: '3.8'

# IORA OS - Services that require IORA OS
# These services are only available when running on IORA OS
# Do NOT use this file for standard Docker Compose installations

services:
  # IORA Supervisor - Docker orchestration (IORA OS ONLY)
  # Requires privileged access to Docker socket - only safe on IORA OS
  iora-supervisor:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: iora-supervisor
    container_name: iora-supervisor
    image: iora/supervisor:latest
    ports:
      - "${SUPERVISOR_PORT:-8097}:8097"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - supervisor_data:/var/lib/iora
    networks:
      - iora-network
    restart: unless-stopped
    privileged: true
    environment:
      - PORT=8097
      - RUST_LOG=${RUST_LOG:-info}
      - IORA_OS=true
    labels:
      iora.managed: "true"
      iora.service: "supervisor"
      iora.critical: "true"
      iora.os_only: "true"
    depends_on:
      postgres:
        condition: service_healthy
      iora-core:
        condition: service_started

networks:
  iora-network:
    external: true

volumes:
  supervisor_data:
    driver: local
