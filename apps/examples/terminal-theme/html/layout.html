<div class="terminal-layout" data-theme-layout="root">
  <div data-slot="background" class="term-bg-slot"></div>
  <div class="term-app">
    <header data-slot="header" class="term-header-slot"></header>
    <div class="term-body">
      <main data-slot="content" class="term-content-slot"></main>
    </div>
    <nav data-slot="navigation" class="term-nav-slot"></nav>
  </div>
  <div data-slot="toast" class="term-toast-slot"></div>
  <div data-slot="assistant" class="term-assistant-slot"></div>
</div>
