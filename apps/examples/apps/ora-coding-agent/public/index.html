<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORA Coding Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M6 3a3 3 0 1 0 .999 5.83A4 4 0 0 0 11 12h2a2 2 0 0 1 2 2v.17a3 3 0 1 0 2 0V14a4 4 0 0 0-4-4h-2a2 2 0 0 1-1.93-1.47A3 3 0 0 0 6 3Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm12 13a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z" />
          </svg>
          <span>ORA Coding Agent</span>
        </header>

        <button id="newTaskBtn" class="primary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          New task
        </button>

        <div class="status-line" id="statusLine">Loading…</div>

        <ul class="task-list" id="taskList"></ul>
      </aside>

      <main class="content" id="content">
        <!-- New task view -->
        <section class="panel" id="newTaskView">
          <h1>Start an agentic coding task</h1>
          <p class="muted">Describe the change. The agent clones the repo, works in an isolated container, and pushes a branch — just like mentioning <code id="mentionHint">@ora</code> on a pull request.</p>
          <form id="taskForm" class="form">
            <label>Repository <span class="req">*</span>
              <input name="repoFullName" placeholder="owner/repo" autocomplete="off" required />
            </label>
            <div class="row">
              <label>Base branch
                <input name="baseBranch" placeholder="main" value="main" autocomplete="off" />
              </label>
              <label>Provider
                <select name="provider" id="providerSelect"></select>
              </label>
              <label>Model
                <input name="model" id="modelInput" placeholder="ora-default" autocomplete="off" />
              </label>
            </div>
            <label>Task / prompt <span class="req">*</span>
              <textarea name="prompt" rows="6" placeholder="e.g. Add input validation to the login form and write a unit test." required></textarea>
            </label>
            <div class="form-actions">
              <button type="submit" class="primary-btn">Start agent</button>
              <span class="error" id="formError"></span>
            </div>
          </form>
        </section>

        <!-- Task detail view -->
        <section class="panel hidden" id="taskDetailView">
          <div class="detail-header">
            <div>
              <h1 id="detailTitle"></h1>
              <div class="detail-meta" id="detailMeta"></div>
            </div>
            <div class="detail-actions">
              <span class="badge" id="detailStatus"></span>
              <button id="cancelBtn" class="ghost-btn hidden">Cancel</button>
            </div>
          </div>
          <div class="prompt-box" id="detailPrompt"></div>
          <div class="result-box hidden" id="detailResult"></div>
          <h2 class="logs-title">Activity</h2>
          <div class="logs" id="logs"></div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
