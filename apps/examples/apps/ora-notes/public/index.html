<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notizen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d12; color: #e5e7eb; min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header button, .note button {
      background: rgba(255,255,255,0.08); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 0.75rem; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.85rem;
      transition: background 0.15s;
    }
    header button:hover, .note button:hover { background: rgba(255,255,255,0.14); }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem; }
    .editor {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem; padding: 1rem; margin-bottom: 1.5rem;
    }
    .editor input, .editor textarea {
      width: 100%; background: rgba(0,0,0,0.3); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.6rem; padding: 0.6rem 0.75rem; margin-bottom: 0.6rem; font-size: 0.9rem;
    }
    .editor textarea { min-height: 5rem; resize: vertical; }
    .editor button.primary { background: #22d3ee; color: #082f36; border: none; font-weight: 600; }
    .note {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem; padding: 1rem; margin-bottom: 0.75rem;
    }
    .note h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .note p { font-size: 0.88rem; color: rgba(255,255,255,0.75); white-space: pre-wrap; word-break: break-word; }
    .note time { display: block; font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 0.6rem; }
    .note .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .empty { text-align: center; color: rgba(255,255,255,0.35); padding: 3rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>✎ Notizen</h1>
    <button id="newBtn">Neue Notiz</button>
  </header>
  <main>
    <div class="editor" id="editor" hidden>
      <input id="titleInput" placeholder="Titel" />
      <textarea id="contentInput" placeholder="Inhalt…"></textarea>
      <button class="primary" id="saveBtn">Speichern</button>
      <button id="cancelBtn">Abbrechen</button>
    </div>
    <div id="list"></div>
  </main>
  <script>
    const list = document.getElementById('list');
    const editor = document.getElementById('editor');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    let editingId = null;

    async function api(path, options) {
      const res = await fetch('/api' + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function load() {
      const notes = await api('/notes');
      list.innerHTML = '';
      if (notes.length === 0) {
        list.innerHTML = '<div class="empty">Noch keine Notizen — erstelle deine erste.</div>';
        return;
      }
      for (const note of notes) {
        const el = document.createElement('div');
        el.className = 'note';
        el.innerHTML = `
          <h2></h2><p></p>
          <time></time>
          <div class="actions">
            <button data-act="edit">Bearbeiten</button>
            <button data-act="delete" style="color:#f87171">Löschen</button>
          </div>`;
        el.querySelector('h2').textContent = note.title;
        el.querySelector('p').textContent = note.content || '';
        el.querySelector('time').textContent = new Date(note.updated_at).toLocaleString();
        el.querySelector('[data-act="edit"]').onclick = () => edit(note);
        el.querySelector('[data-act="delete"]').onclick = async () => {
          await api('/notes/' + note.id, { method: 'DELETE' });
          load();
        };
        list.appendChild(el);
      }
    }

    function edit(note) {
      editingId = note.id;
      titleInput.value = note.title;
      contentInput.value = note.content || '';
      editor.hidden = false;
      titleInput.focus();
    }

    document.getElementById('newBtn').onclick = () => {
      editingId = null;
      titleInput.value = '';
      contentInput.value = '';
      editor.hidden = false;
      titleInput.focus();
    };
    document.getElementById('cancelBtn').onclick = () => { editor.hidden = true; editingId = null; };
    document.getElementById('saveBtn').onclick = async () => {
      const body = { title: titleInput.value, content: contentInput.value };
      if (editingId) await api('/notes/' + editingId, { method: 'PUT', body: JSON.stringify(body) });
      else await api('/notes', { method: 'POST', body: JSON.stringify(body) });
      editor.hidden = true;
      editingId = null;
      load();
    };

    load();
  </script>
</body>
</html>
