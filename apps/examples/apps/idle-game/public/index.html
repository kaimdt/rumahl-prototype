<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>rumahl Forge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;overflow:hidden;font-family:monospace}
canvas{display:block}
#topbar{position:fixed;top:0;left:0;right:0;height:28px;background:rgba(20,15,10,.92);border-bottom:2px solid #5a4a3a;display:flex;align-items:center;padding:0 6px;gap:6px;z-index:100}
#topbar .t{color:#fd0;font-weight:bold;font-size:.7rem}
#topbar span{font-size:.62rem;color:#ba9}
#res{display:flex;gap:6px;flex:1;justify-content:center}
#res .r{font-size:.62rem;color:#edc;font-weight:bold}
#topbar button{background:rgba(60,40,20,.5);border:1px solid #6a5a3a;color:#ba9;padding:1px 5px;font-size:.58rem;cursor:pointer;font-family:monospace}
#topbar button:hover{border-color:#8a7a5a;color:#fd0}
#bbar{position:fixed;bottom:0;left:0;right:0;background:rgba(20,15,10,.92);border-top:2px solid #5a4a3a;z-index:100;padding:3px 0;display:flex;justify-content:center;gap:3px;flex-wrap:wrap}
.bb{display:flex;flex-direction:column;align-items:center;background:rgba(50,30,15,.5);border:2px solid #4a3a2a;border-radius:3px;padding:2px 5px;cursor:pointer;min-width:55px;font-family:monospace;transition:.15s}
.bb:hover{border-color:#8a7a5a;background:rgba(70,40,20,.6)}
.bb.d{opacity:.35;cursor:not-allowed}
.bb .i{font-size:1rem}.bb .n{font-size:.48rem;color:#ba9}.bb .c{font-size:.42rem;color:#fd0}
#toasts{position:fixed;top:32px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none}
.toast{background:rgba(20,15,10,.9);border:1px solid #8a7a5a;padding:2px 7px;color:#fd0;font-size:.55rem;animation:ti .3s ease,to .3s ease 2.7s forwards;font-family:monospace}
@keyframes ti{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes to{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topbar"><span class="t">rumahl Forge</span><span id="info"></span><div id="res"></div><button onclick="save()">💾</button><button onclick="load()">📂</button></div>
<div id="bbar"></div><div id="toasts"></div>
<div id="sidepanel" style="display:none;position:fixed;top:50%;right:8px;transform:translateY(-50%);background:rgba(20,15,10,.95);border:2px solid #8a7a5a;border-radius:4px;padding:8px 12px;min-width:180px;max-width:220px;z-index:150;color:#cba;font-family:monospace;font-size:.65rem;pointer-events:all"></div>
<script src="game.js"></script>
</body>
</html>
