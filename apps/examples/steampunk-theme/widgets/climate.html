<!--
  STEAMPUNK – Climate Widget Template (Thermometer/Pressure Gauge)
  Dual-scale thermometer with brass housing.
-->
<div class="steampunk-climate-widget" style="
  position: relative;
  background: linear-gradient(
    135deg,
    oklch(0.32 0.03 30 / 0.25) 0%,
    oklch(0.24 0.035 80 / 0.7) 30%,
    oklch(0.28 0.03 200 / 0.25) 100%
  );
  border: 2px solid oklch(from var(--accent) calc(l + 0.1) c h / 0.4);
  border-radius: 4px;
  padding: 18px;
  box-shadow:
    0 4px 16px oklch(0 0 0 / 0.35),
    inset 0 1px 0 oklch(from var(--accent) l c h / 0.08);
">

  <!-- Top label row -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <span style="
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      letter-spacing: 0.03em;
      color: var(--foreground);
    " data-prop-bind="entity.name">Climate</span>

    <!-- Mode indicator -->
    <span style="
      font-family: 'Courier Prime', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: oklch(from var(--accent) l c h / 0.6);
      background: oklch(from var(--accent) l c h / 0.08);
      padding: 2px 8px;
      border-radius: 2px;
      border: 1px solid oklch(from var(--accent) l c h / 0.15);
    " data-prop-bind="entity.state">off</span>
  </div>

  <!-- Temperature display (large, gauge-style) -->
  <div style="
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin: 8px 0;
  ">
    <span style="
      font-family: 'Courier Prime', monospace;
      font-size: 36px;
      font-weight: 700;
      color: oklch(from var(--accent) calc(l + 0.1) c h);
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 0 20px oklch(from var(--accent) l c h / 0.2);
    " data-prop-bind="entity.attr.temperature">--</span>
    <span style="
      font-family: 'IM Fell English', serif;
      font-size: 14px;
      color: oklch(from var(--accent) l c h / 0.6);
      margin-left: 2px;
    " data-prop-bind="entity.unit">°C</span>
  </div>

  <!-- Target temperature row -->
  <div style="
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid oklch(from var(--accent) l c h / 0.1);
  ">
    <span style="font-size:10px;color:oklch(from var(--accent) l c h / 0.4);font-family:'Courier Prime',monospace;">TARGET</span>
    <span style="
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: oklch(from var(--accent) l c h / 0.7);
    " data-prop-bind="entity.attr.temperature">--</span>
    <span style="font-size:10px;color:oklch(from var(--accent) l c h / 0.3);" data-prop-bind="entity.unit">°C</span>
  </div>

  <!-- Rivets -->
  <div style="position:absolute;top:4px;left:4px;width:5px;height:5px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.45);box-shadow:0 0 2px oklch(0 0 0 / 0.4);"></div>
  <div style="position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.45);box-shadow:0 0 2px oklch(0 0 0 / 0.4);"></div>
  <div style="position:absolute;bottom:4px;left:4px;width:5px;height:5px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.45);box-shadow:0 0 2px oklch(0 0 0 / 0.4);"></div>
  <div style="position:absolute;bottom:4px;right:4px;width:5px;height:5px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.45);box-shadow:0 0 2px oklch(0 0 0 / 0.4);"></div>

  <!-- Side gauge decoration -->
  <div style="position:absolute;right:-2px;top:15%;bottom:15%;width:3px;background:linear-gradient(180deg, oklch(0.55 0.15 30 / 0.5), oklch(0.50 0.12 200 / 0.5));border-radius:2px;box-shadow:0 0 6px oklch(0 0 0 / 0.3);"></div>
</div>
