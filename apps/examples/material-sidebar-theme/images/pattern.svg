<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="elevationNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="linear" slope="0.05" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="cardElevation" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d5e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accentStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rippleCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="100" height="100" fill="#1a1a2e"/>
  <!-- Elevation noise -->
  <rect width="100" height="100" filter="url(#elevationNoise)"/>
  <!-- Card/panel shapes -->
  <rect x="4" y="4" width="42" height="92" rx="6" fill="#1e1e3a" opacity="0.5"/>
  <rect x="4" y="4" width="42" height="92" rx="6" fill="url(#cardElevation)"/>
  <rect x="52" y="4" width="44" height="42" rx="8" fill="#1e1e3a" opacity="0.4"/>
  <rect x="52" y="4" width="44" height="42" rx="8" fill="url(#cardElevation)"/>
  <rect x="52" y="54" width="20" height="42" rx="8" fill="#1e1e3a" opacity="0.35"/>
  <rect x="76" y="54" width="20" height="42" rx="8" fill="#1e1e3a" opacity="0.35"/>
  <!-- Sidebar accent line -->
  <rect x="4" y="4" width="2" height="92" rx="1" fill="url(#accentStripe)"/>
  <!-- Active nav item -->
  <rect x="8" y="20" width="34" height="10" rx="5" fill="#6366f1" opacity="0.1"/>
  <!-- Nav item indicators -->
  <rect x="10" y="38" width="20" height="1.5" rx="0.75" fill="#6366f1" opacity="0.15"/>
  <rect x="10" y="46" width="16" height="1.5" rx="0.75" fill="#8b5cf6" opacity="0.1"/>
  <rect x="10" y="54" width="22" height="1.5" rx="0.75" fill="#6366f1" opacity="0.12"/>
  <rect x="10" y="62" width="14" height="1.5" rx="0.75" fill="#8b5cf6" opacity="0.1"/>
  <!-- Ripple circles -->
  <circle cx="50" cy="12" r="12" fill="none" stroke="#6366f1" stroke-width="0.4" opacity="0.08"/>
  <circle cx="50" cy="12" r="20" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.05"/>
  <circle cx="74" cy="42" r="10" fill="none" stroke="#6366f1" stroke-width="0.3" opacity="0.06"/>
  <!-- Grid dots -->
  <circle cx="25" cy="75" r="0.6" fill="#6366f1" opacity="0.08"/>
  <circle cx="50" cy="75" r="0.6" fill="#6366f1" opacity="0.08"/>
  <circle cx="75" cy="75" r="0.6" fill="#6366f1" opacity="0.08"/>
  <circle cx="25" cy="85" r="0.6" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="50" cy="85" r="0.6" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="75" cy="85" r="0.6" fill="#8b5cf6" opacity="0.06"/>
</svg>
