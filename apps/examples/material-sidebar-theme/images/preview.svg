<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Sidebar -->
  <rect x="10" y="10" width="100" height="280" rx="16" fill="#1e1e3a" stroke="#2d2d5e" stroke-width="0.5"/>
  <!-- Sidebar items -->
  <rect x="20" y="30" width="80" height="8" rx="4" fill="url(#accentGrad)" opacity="0.3"/>
  <rect x="20" y="50" width="60" height="6" rx="3" fill="#4a4a8a" opacity="0.4"/>
  <rect x="20" y="65" width="50" height="6" rx="3" fill="#4a4a8a" opacity="0.4"/>
  <rect x="20" y="80" width="70" height="6" rx="3" fill="#4a4a8a" opacity="0.4"/>
  <!-- Active nav item -->
  <rect x="16" y="100" width="88" height="24" rx="12" fill="url(#accentGrad)" opacity="0.15"/>
  <rect x="24" y="108" width="8" height="8" rx="4" fill="#818cf8"/>
  <rect x="38" y="109" width="40" height="5" rx="2.5" fill="#818cf8" opacity="0.8"/>
  <!-- Main content area -->
  <rect x="120" y="10" width="270" height="280" rx="16" fill="#1a1a2e" opacity="0.5"/>
  <!-- Header -->
  <rect x="130" y="18" width="250" height="28" rx="8" fill="#1e1e3a" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="148" cy="32" r="4" fill="#6366f1"/>
  <rect x="158" y="28" width="40" height="8" rx="2" fill="#a5b4fc" opacity="0.6"/>
  <!-- Cards -->
  <rect x="130" y="55" width="118" height="50" rx="12" fill="#1e1e3a" stroke="#2d2d5e" stroke-width="0.5" filter="url(#shadow)"/>
  <circle cx="148" cy="80" r="8" fill="#6366f1" opacity="0.4"/>
  <rect x="162" y="75" width="50" height="6" rx="3" fill="#c7d2fe" opacity="0.6"/>
  <rect x="162" y="86" width="35" height="4" rx="2" fill="#64748b" opacity="0.4"/>
  <rect x="255" y="55" width="125" height="50" rx="12" fill="#1e1e3a" stroke="#2d2d5e" stroke-width="0.5" filter="url(#shadow)"/>
  <circle cx="273" cy="80" r="8" fill="#8b5cf6" opacity="0.4"/>
  <rect x="287" y="75" width="50" height="6" rx="3" fill="#c7d2fe" opacity="0.6"/>
  <rect x="287" y="86" width="40" height="4" rx="2" fill="#64748b" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10" letter-spacing="5" font-weight="300">MATERIAL</text>
</svg>
