<div class="theme-widget theme-widget-weather" data-entity-id="{{entity_id}}">
  <div class="theme-widget-icon-large">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/>
      <circle cx="12" cy="12" r="5"/>
    </svg>
  </div>
  <div class="theme-widget-content">
    <span class="theme-widget-label">{{friendly_name}}</span>
    <span class="theme-widget-temp-large">{{temperature}}°</span>
  </div>
  <div class="theme-widget-details">
    <span class="theme-widget-detail">{{condition}}</span>
    <span class="theme-widget-detail">💧 {{humidity}}%</span>
  </div>
</div>
