<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Moss texture base -->
    <pattern id="moss" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#14201A"/>
      <!-- Moss speckles -->
      <circle cx="5" cy="5" r="1.5" fill="#2A4028" opacity="0.5"/>
      <circle cx="20" cy="8" r="1" fill="#1E301C" opacity="0.4"/>
      <circle cx="35" cy="3" r="1.2" fill="#2E4428" opacity="0.45"/>
      <circle cx="8" cy="20" r="0.8" fill="#243820" opacity="0.35"/>
      <circle cx="25" cy="18" r="1.3" fill="#2A3C24" opacity="0.4"/>
      <circle cx="15" cy="35" r="1" fill="#203420" opacity="0.4"/>
      <circle cx="32" cy="30" r="1.4" fill="#2A4028" opacity="0.45"/>
      <circle cx="38" cy="18" r="0.9" fill="#1E301C" opacity="0.35"/>
      <circle cx="3" cy="38" r="1.1" fill="#243820" opacity="0.4"/>
      <circle cx="18" cy="38" r="0.7" fill="#2E4428" opacity="0.3"/>
    </pattern>
    <!-- Wood ring pattern -->
    <pattern id="woodrings" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <ellipse cx="50" cy="50" rx="40" ry="20" fill="none" stroke="#3D5040" stroke-width="0.3" opacity="0.3"/>
      <ellipse cx="50" cy="50" rx="35" ry="17.5" fill="none" stroke="#3D5040" stroke-width="0.25" opacity="0.25"/>
      <ellipse cx="50" cy="50" rx="28" ry="14" fill="none" stroke="#3D5040" stroke-width="0.3" opacity="0.3"/>
      <ellipse cx="50" cy="50" rx="20" ry="10" fill="none" stroke="#3D5040" stroke-width="0.2" opacity="0.2"/>
      <ellipse cx="50" cy="50" rx="12" ry="6" fill="none" stroke="#3D5040" stroke-width="0.25" opacity="0.25"/>
      <ellipse cx="50" cy="50" rx="5" ry="2.5" fill="none" stroke="#3D5040" stroke-width="0.2" opacity="0.15"/>
    </pattern>
    <!-- Leaf scatter pattern -->
    <pattern id="leaves" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <ellipse cx="15" cy="15" rx="6" ry="3" fill="#2A4028" opacity="0.25" transform="rotate(-20 15 15)"/>
      <ellipse cx="55" cy="10" rx="4" ry="2" fill="#243820" opacity="0.2" transform="rotate(30 55 10)"/>
      <ellipse cx="30" cy="55" rx="5" ry="2.5" fill="#2A4028" opacity="0.22" transform="rotate(-15 30 55)"/>
      <ellipse cx="70" cy="50" rx="3.5" ry="2" fill="#1E301C" opacity="0.18" transform="rotate(45 70 50)"/>
      <ellipse cx="60" cy="75" rx="4.5" ry="2" fill="#2E4428" opacity="0.2" transform="rotate(-35 60 75)"/>
      <ellipse cx="10" cy="70" rx="3" ry="1.5" fill="#243820" opacity="0.15" transform="rotate(10 10 70)"/>
    </pattern>
    <!-- Fire glow radial -->
    <radialGradient id="fireGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#6A4A1A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#14201A" stop-opacity="0"/>
    </radialGradient>
    <!-- Pine silhouette unit -->
    <pattern id="pines" x="0" y="0" width="160" height="80" patternUnits="userSpaceOnUse">
      <polygon points="20,60 40,15 60,60" fill="#1A2E1A" opacity="0.3"/>
      <polygon points="15,70 40,5 65,70" fill="#132213" opacity="0.25"/>
      <polygon points="100,55 120,20 140,55" fill="#1A2E1A" opacity="0.25"/>
      <polygon points="95,65 120,10 145,65" fill="#132213" opacity="0.2"/>
    </pattern>
  </defs>
  <!-- Base background -->
  <rect width="400" height="400" fill="#14201A"/>
  <!-- Moss texture layer -->
  <rect width="400" height="400" fill="url(#moss)"/>
  <!-- Wood rings layer -->
  <rect width="400" height="400" fill="url(#woodrings)"/>
  <!-- Leaf scatter layer -->
  <rect width="400" height="400" fill="url(#leaves)"/>
  <!-- Pine silhouettes along bottom -->
  <rect width="400" height="160" y="280" fill="url(#pines)"/>
  <!-- Fire glow at bottom -->
  <rect width="400" height="400" fill="url(#fireGlow)"/>
  <!-- Ground fog / mist -->
  <path d="M0 320 Q100 310 200 320 T400 320 L400 400 L0 400Z" fill="#1A2E1A" opacity="0.15"/>
</svg>