<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="forestCornerGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5A2A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1A2E1A" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A6A3A"/>
      <stop offset="100%" stop-color="#2A4A1A"/>
    </linearGradient>
  </defs>
  <!-- Forest corner base -->
  <path d="M80 0 Q0 0 0 80" fill="url(#forestCornerGrad)"/>
  <!-- Pine branch silhouettes -->
  <g opacity="0.5">
    <!-- Branch 1 -->
    <line x1="60" y1="5" x2="30" y2="25" stroke="#2A4028" stroke-width="1.2"/>
    <line x1="50" y1="12" x2="35" y2="18" stroke="#1E301C" stroke-width="0.8"/>
    <line x1="42" y1="15" x2="28" y2="22" stroke="#243820" stroke-width="0.7"/>
    <!-- Branch 2 -->
    <line x1="35" y1="1" x2="10" y2="30" stroke="#2A4028" stroke-width="1"/>
    <line x1="25" y1="8" x2="5" y2="22" stroke="#1E301C" stroke-width="0.6"/>
    <!-- Pine needles -->
    <line x1="30" y1="25" x2="38" y2="28" stroke="#3A5A2A" stroke-width="0.4"/>
    <line x1="30" y1="25" x2="32" y2="30" stroke="#3A5A2A" stroke-width="0.35"/>
    <line x1="10" y1="30" x2="15" y2="34" stroke="#3A5A2A" stroke-width="0.35"/>
    <line x1="10" y1="30" x2="7" y2="35" stroke="#3A5A2A" stroke-width="0.3"/>
  </g>
  <!-- Leaf accents -->
  <g opacity="0.4">
    <ellipse cx="55" cy="15" rx="5" ry="2.5" fill="url(#leafGrad)" transform="rotate(-30 55 15)"/>
    <ellipse cx="15" cy="55" rx="4" ry="2" fill="url(#leafGrad)" transform="rotate(20 15 55)"/>
    <ellipse cx="40" cy="40" rx="3.5" ry="1.8" fill="url(#leafGrad)" transform="rotate(-10 40 40)"/>
  </g>
  <!-- Woody corner highlight -->
  <path d="M80 0 Q20 0 0 20" fill="none" stroke="#8B6914" stroke-width="0.5" opacity="0.15"/>
</svg>