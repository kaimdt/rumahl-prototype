<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="monoGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#989898"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="55" fill="#1A1A1A" stroke="#383838" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#2A2A2A" stroke-width="0.5"/>
  <!-- Geometric diamond icon -->
  <g transform="translate(60,60)">
    <!-- Outer diamond -->
    <path d="M0,-32 L32,0 L0,32 L-32,0 Z" fill="none" stroke="url(#monoGrad)" stroke-width="2.5"/>
    <!-- Inner diamond -->
    <path d="M0,-22 L22,0 L0,22 L-22,0 Z" fill="none" stroke="url(#monoGrad2)" stroke-width="1.5"/>
    <!-- Core diamond -->
    <path d="M0,-12 L12,0 L0,12 L-12,0 Z" fill="#606060" opacity="0.5"/>
    <!-- Core accent -->
    <path d="M0,-6 L6,0 L0,6 L-6,0 Z" fill="#808080" opacity="0.4"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#A0A0A0" opacity="0.6"/>
    <!-- Crosshairs -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#404040" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#404040" stroke-width="0.5" opacity="0.4"/>
    <!-- Dot grid accents on axes -->
    <circle cx="-20" cy="0" r="1" fill="#505050" opacity="0.3"/>
    <circle cx="20" cy="0" r="1" fill="#505050" opacity="0.3"/>
    <circle cx="0" cy="-20" r="1" fill="#505050" opacity="0.3"/>
    <circle cx="0" cy="20" r="1" fill="#505050" opacity="0.3"/>
    <!-- Diagonal accent dots -->
    <circle cx="-18" cy="-18" r="0.8" fill="#505050" opacity="0.2"/>
    <circle cx="18" cy="-18" r="0.8" fill="#505050" opacity="0.2"/>
    <circle cx="-18" cy="18" r="0.8" fill="#505050" opacity="0.2"/>
    <circle cx="18" cy="18" r="0.8" fill="#505050" opacity="0.2"/>
  </g>
</svg>