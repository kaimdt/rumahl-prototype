<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#404040" opacity="0.3"/>
    </pattern>
    <pattern id="diamonds" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 5 L55 30 L30 55 L5 30 Z" fill="none" stroke="#383838" stroke-width="0.5" opacity="0.35"/>
      <path d="M30 12 L48 30 L30 48 L12 30 Z" fill="none" stroke="#383838" stroke-width="0.3" opacity="0.25"/>
    </pattern>
    <pattern id="archLines" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="1" fill="#333333" opacity="0.15"/>
      <rect x="0" y="25" width="100" height="0.5" fill="#383838" opacity="0.12"/>
      <rect x="0" y="50" width="100" height="1" fill="#333333" opacity="0.15"/>
      <rect x="0" y="75" width="100" height="0.5" fill="#383838" opacity="0.12"/>
      <line x1="50" y1="0" x2="50" y2="25" stroke="#383838" stroke-width="0.4" opacity="0.1"/>
      <line x1="50" y1="75" x2="50" y2="100" stroke="#383838" stroke-width="0.4" opacity="0.1"/>
    </pattern>
    <pattern id="microTexture" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#222222" opacity="0.15"/>
      <rect x="4" y="4" width="4" height="4" fill="#222222" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#1A1A1A"/>
  <rect width="400" height="400" fill="url(#microTexture)"/>
  <rect width="400" height="400" fill="url(#dotGrid)"/>
  <rect width="400" height="400" fill="url(#archLines)"/>
  <rect width="400" height="400" fill="url(#diamonds)"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#2A2A2A" stroke-width="0.3" opacity="0.5"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#2A2A2A" stroke-width="0.3" opacity="0.35"/>
  <rect x="0" y="0" width="100" height="1" fill="#404040" opacity="0.1"/>
  <rect x="0" y="0" width="1" height="100" fill="#404040" opacity="0.1"/>
  <rect x="300" y="399" width="100" height="1" fill="#404040" opacity="0.1"/>
  <rect x="399" y="300" width="1" height="100" fill="#404040" opacity="0.1"/>
