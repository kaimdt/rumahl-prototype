<!-- Steampunk Widget Frame Template -->
<div class="steampunk-widget" style="border:1.5px solid oklch(0.35 0.06 60 / 0.4);border-radius:8px;background:oklch(0.14 0.03 55 / 0.65);padding:12px;box-shadow:0 2px 8px oklch(0 0 0 / 0.3), inset 0 1px 0 oklch(0.72 0.14 70 / 0.08)">
  <div class="steampunk-widget-title" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid oklch(0.35 0.06 60 / 0.3);font-family:'Playfair Display',serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em">
    <span style="font-size:14px">⚙</span>
    {{title}}
  </div>
  <div class="steampunk-widget-content">{{content}}</div>
</div>
