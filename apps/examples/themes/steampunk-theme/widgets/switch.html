<!--
  STEAMPUNK – Switch Widget Template (Lever Control)
  Victorian-era toggle lever with brass detailing.
-->
<div class="steampunk-switch-widget" style="
  position: relative;
  background: linear-gradient(
    180deg,
    oklch(0.28 0.03 80 / 0.8) 0%,
    oklch(0.22 0.025 75 / 0.7) 100%
  );
  border: 2px solid oklch(from var(--accent) calc(l + 0.1) calc(c * 0.5) h / 0.45);
  border-radius: 3px;
  padding: 14px 16px;
  box-shadow:
    0 3px 12px oklch(0 0 0 / 0.35),
    inset 0 1px 0 oklch(from var(--accent) l c h / 0.08);
  transition: border-color 0.3s ease;
">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <!-- Status indicator (mini gauge) -->
      <div style="
        width: 10px; height: 10px;
        border-radius: 50%;
        background: oklch(from var(--accent) l c h);
        box-shadow: 0 0 8px oklch(from var(--accent) l c h / 0.5);
        transition: background 0.4s, box-shadow 0.4s;
      " data-prop-bind="entity.is_on" data-prop-class="steampunk-switch-on"></div>

      <span style="
        font-family: 'IM Fell English', serif;
        font-size: 13px;
        letter-spacing: 0.03em;
        color: var(--foreground);
      " data-prop-bind="entity.name">Switch</span>
    </div>

    <span style="
      font-family: 'Courier Prime', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: oklch(from var(--accent) l c h / 0.7);
    " data-prop-bind="entity.state">off</span>
  </div>

  <!-- Rivets -->
  <div style="position:absolute;top:3px;left:3px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.4);"></div>
  <div style="position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.4);"></div>
  <div style="position:absolute;bottom:3px;left:3px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.4);"></div>
  <div style="position:absolute;bottom:3px;right:3px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.4);"></div>
</div>

<style>
  .steampunk-switch-on {
    background: oklch(0.55 0.18 140) !important;
    box-shadow: 0 0 12px oklch(0.55 0.18 140 / 0.6), 0 0 24px oklch(0.55 0.18 140 / 0.3) !important;
  }
</style>
