<!-- STEAMPUNK – Weather Widget (Barometer) -->
<div class="steampunk-weather-widget" style="
  position:relative; background:linear-gradient(180deg,oklch(0.28 0.03 240/0.5) 0%,oklch(0.20 0.02 240/0.4) 100%);
  border:2px solid oklch(0.55 0.12 240/0.3); border-radius:4px; padding:16px; overflow:hidden;
  box-shadow:0 4px 16px oklch(0 0 0/0.35), inset 0 1px 0 oklch(0.65 0.08 240/0.08);">

  <!-- Barometer top ornament -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
    <div style="width:20px;height:20px;border-radius:50%;border:2px solid oklch(0.55 0.12 240/0.5);display:flex;align-items:center;justify-content:center;font-size:10px;color:oklch(0.60 0.10 240/0.7);">☁</div>
    <span style="font-family:'IM Fell English',serif;font-size:13px;letter-spacing:0.03em;color:var(--foreground);" data-prop-bind="entity.name">Weather</span>
  </div>

  <!-- Temperature (large dial) -->
  <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin:10px 0;">
    <span style="font-family:'Courier Prime',monospace;font-size:40px;font-weight:700;color:oklch(0.65 0.10 30/0.9);line-height:1;text-shadow:0 0 15px oklch(0.55 0.12 30/0.2);" data-prop-bind="entity.attr.temperature">--</span>
    <span style="font-family:'IM Fell English',serif;font-size:13px;color:oklch(0.55 0.08 30/0.6);">°C</span>
  </div>

  <!-- Conditions row -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0;padding:8px 0;border-top:1px solid oklch(0.50 0.08 240/0.15);border-bottom:1px solid oklch(0.50 0.08 240/0.15);">
    <span style="font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:oklch(0.55 0.08 240/0.6);" data-prop-bind="entity.state">--</span>
    <span style="font-family:'Courier Prime',monospace;font-size:10px;color:oklch(0.55 0.08 240/0.5);">
      💧 <span data-prop-bind="entity.attr.humidity">--</span>%
    </span>
  </div>

  <!-- Pressure indicator -->
  <div style="font-family:'Courier Prime',monospace;font-size:9px;color:oklch(0.50 0.06 240/0.4);text-align:center;letter-spacing:0.05em;">
    PRESS <span data-prop-bind="entity.attr.pressure">--</span> hPa
  </div>

  <!-- Corner rivets -->
  <div style="position:absolute;top:4px;left:4px;width:4px;height:4px;border-radius:50%;background:oklch(0.55 0.10 240/0.5);box-shadow:0 0 2px oklch(0 0 0/0.4);"></div>
  <div style="position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:oklch(0.55 0.10 240/0.5);"></div>
  <div style="position:absolute;bottom:4px;left:4px;width:4px;height:4px;border-radius:50%;background:oklch(0.55 0.10 240/0.5);"></div>
  <div style="position:absolute;bottom:4px;right:4px;width:4px;height:4px;border-radius:50%;background:oklch(0.55 0.10 240/0.5);"></div>
</div>
