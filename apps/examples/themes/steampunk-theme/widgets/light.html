<!--
  STEAMPUNK – Light Widget Template (Gaslamp)
  Replaces the default light widget with a Victorian gaslamp design.
  
  data-prop-bind: replaces element content with entity value
  data-slot="content": embeds the default React widget (for hybrid mode)
-->
<div class="steampunk-light-widget" style="
  position: relative;
  background: linear-gradient(
    180deg,
    oklch(0.30 0.04 80 / 0.85) 0%,
    oklch(0.22 0.03 75 / 0.75) 100%
  );
  border: 2px solid oklch(from var(--accent) calc(l + 0.15) calc(c * 0.5) h / 0.5);
  border-radius: 3px;
  padding: 16px;
  overflow: hidden;
  box-shadow:
    0 4px 20px oklch(0 0 0 / 0.4),
    0 0 20px oklch(from var(--accent) l c h / 0.08),
    inset 0 1px 0 oklch(from var(--accent) l c h / 0.1);
  transition: all 0.4s ease;
">

  <!-- Gaslamp glow effect -->
  <div style="
    position: absolute;
    top: -30px; right: -20px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      oklch(from var(--accent) l c h / 0.15) 0%,
      oklch(from var(--accent) l c h / 0.05) 40%,
      transparent 70%
    );
    pointer-events: none;
    animation: gaslight-flicker 8s ease-in-out infinite;
  "></div>

  <!-- Top ornament -->
  <div style="
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  ">
    <div style="
      width: 24px; height: 24px;
      background: oklch(from var(--accent) l c h / 0.2);
      border: 1px solid oklch(from var(--accent) calc(l + 0.1) c h / 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    ">💡</div>
    <span style="
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--foreground);
    " data-prop-bind="entity.name">Light</span>
    <span style="
      margin-left: auto;
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      color: oklch(from var(--accent) l c h / 0.8);
    " data-prop-bind="entity.state">off</span>
  </div>

  <!-- Brightness gauge (steampunk dial) -->
  <div style="
    height: 4px;
    background: oklch(0.15 0.015 80 / 0.5);
    border-radius: 2px;
    margin: 8px 0;
    overflow: hidden;
    border: 1px solid oklch(from var(--accent) l c h / 0.15);
    position: relative;
  ">
    <div style="
      height: 100%;
      background: linear-gradient(
        90deg,
        oklch(from var(--accent) l c h / 0.4),
        oklch(from var(--accent) calc(l + 0.1) c h / 0.7)
      );
      border-radius: 2px;
      transition: width 0.5s ease;
      box-shadow: 0 0 6px oklch(from var(--accent) l c h / 0.2);
    " data-prop-bind="entity.attr.brightness" data-prop-style="width" style="width: 0%"></div>
  </div>

  <!-- Corner rivets -->
  <div style="position:absolute;top:4px;left:4px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.5);box-shadow:0 0 2px oklch(0 0 0 / 0.5);"></div>
  <div style="position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.5);box-shadow:0 0 2px oklch(0 0 0 / 0.5);"></div>
  <div style="position:absolute;bottom:4px;left:4px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.5);box-shadow:0 0 2px oklch(0 0 0 / 0.5);"></div>
  <div style="position:absolute;bottom:4px;right:4px;width:4px;height:4px;border-radius:50%;background:oklch(from var(--accent) l c h / 0.5);box-shadow:0 0 2px oklch(0 0 0 / 0.5);"></div>
</div>
