<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f0e"/>
      <stop offset="30%" stop-color="#22170a"/>
      <stop offset="60%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#2a1f0e"/>
    </linearGradient>
    <radialGradient id="gearCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rivetGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="60%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
    <pattern id="bgPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Background base -->
      <rect width="200" height="200" fill="url(#bgGrad)"/>
      <!-- Large gear background -->
      <g transform="translate(60,60)" opacity="0.08">
        <circle r="55" fill="none" stroke="#d4a017" stroke-width="1"/>
        <circle r="35" fill="none" stroke="#d4a017" stroke-width="0.5"/>
        <circle r="45" fill="none" stroke="#b8860b" stroke-width="0.3" stroke-dasharray="5 5"/>
        <circle r="12" fill="none" stroke="#d4a017" stroke-width="0.7"/>
        <!-- Gear teeth -->
        <g fill="none" stroke="#d4a017" stroke-width="0.6">
          <rect x="-5" y="-63" width="10" height="16" rx="2"/>
          <rect x="-5" y="47" width="10" height="16" rx="2"/>
          <rect x="-63" y="-5" width="16" height="10" rx="2"/>
          <rect x="47" y="-5" width="16" height="10" rx="2"/>
          <rect x="32" y="-52" width="10" height="16" rx="2" transform="rotate(45,37,-44)"/>
          <rect x="-42" y="-52" width="10" height="16" rx="2" transform="rotate(-45,-37,-44)"/>
          <rect x="32" y="36" width="10" height="16" rx="2" transform="rotate(-45,37,44)"/>
          <rect x="-42" y="36" width="10" height="16" rx="2" transform="rotate(45,-37,44)"/>
        </g>
      </g>
      <!-- Small gear -->
      <g transform="translate(160,40)" opacity="0.06">
        <circle r="25" fill="none" stroke="#d4a017" stroke-width="0.8"/>
        <circle r="8" fill="none" stroke="#b8860b" stroke-width="0.5"/>
        <g fill="none" stroke="#d4a017" stroke-width="0.5">
          <rect x="-3" y="-30" width="6" height="10" rx="1.5"/>
          <rect x="-3" y="20" width="6" height="10" rx="1.5"/>
          <rect x="-30" y="-3" width="10" height="6" rx="1.5"/>
          <rect x="20" y="-3" width="10" height="6" rx="1.5"/>
        </g>
      </g>
      <!-- Filigree curls -->
      <g opacity="0.06">
        <path d="M30,140 C10,120 10,90 30,80 C15,85 5,110 20,130" fill="none" stroke="#d4a017" stroke-width="0.7"/>
        <path d="M170,160 C190,140 190,110 170,100 C185,105 195,130 180,150" fill="none" stroke="#b8860b" stroke-width="0.7"/>
      </g>
      <!-- Rivets -->
      <circle cx="20" cy="175" r="3" fill="url(#rivetGlow)" opacity="0.15"/>
      <circle cx="180" cy="20" r="3" fill="url(#rivetGlow)" opacity="0.15"/>
      <circle cx="100" cy="180" r="2.5" fill="url(#rivetGlow)" opacity="0.1"/>
      <circle cx="185" cy="95" r="2.5" fill="url(#rivetGlow)" opacity="0.1"/>
      <!-- Diagonal brass lines -->
      <line x1="0" y1="100" x2="200" y2="100" stroke="#d4a017" stroke-width="0.3" opacity="0.05"/>
      <line x1="0" y1="150" x2="200" y2="150" stroke="#d4a017" stroke-width="0.3" opacity="0.04"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#d4a017" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bgPattern)"/>
</svg>
