<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f0e"/>
      <stop offset="50%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#3d2b1a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="8"/>
  <!-- Gear -->
  <g transform="translate(100,100)">
    <circle r="30" fill="none" stroke="url(#brass)" stroke-width="4"/>
    <circle r="18" fill="none" stroke="#cd7f32" stroke-width="3"/>
    <circle r="6" fill="#d4a017"/>
    <!-- Gear teeth -->
    <rect x="-4" y="-38" width="8" height="12" rx="1" fill="url(#brass)"/>
    <rect x="-4" y="26" width="8" height="12" rx="1" fill="url(#brass)"/>
    <rect x="-38" y="-4" width="12" height="8" rx="1" fill="url(#brass)"/>
    <rect x="26" y="-4" width="12" height="8" rx="1" fill="url(#brass)"/>
    <rect x="18" y="-32" width="8" height="12" rx="1" fill="url(#brass)" transform="rotate(45,22,-26)"/>
    <rect x="-26" y="-32" width="8" height="12" rx="1" fill="url(#brass)" transform="rotate(-45,-22,-26)"/>
    <rect x="18" y="20" width="8" height="12" rx="1" fill="url(#brass)" transform="rotate(-45,22,26)"/>
    <rect x="-26" y="20" width="8" height="12" rx="1" fill="url(#brass)" transform="rotate(45,-22,26)"/>
  </g>
</svg>
