<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="leatherCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2b1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="dimmed">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
    <pattern id="leather" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#241a0c" opacity="0.4"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#3d2b1a" stroke-width="0.3" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#3d2b1a" stroke-width="0.3" opacity="0.3"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#2a1f0e" stroke-width="0.2" opacity="0.2"/>
    </pattern>
    <linearGradient id="brassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.03"/>
      <stop offset="40%" stop-color="#d4a017" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#b8860b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8b6914" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#1a1208"/>
  <rect width="100" height="100" fill="url(#leather)"/>
  <rect width="100" height="100" filter="url(#noise)"/>
  <rect width="100" height="100" fill="url(#brassSheen)"/>
  <!-- Subtle rivet dots -->
  <circle cx="2" cy="2" r="0.8" fill="#8b6914" opacity="0.15"/>
  <circle cx="50" cy="0" r="0.6" fill="#8b6914" opacity="0.08"/>
  <circle cx="98" cy="2" r="0.8" fill="#8b6914" opacity="0.15"/>
  <circle cx="98" cy="50" r="0.6" fill="#8b6914" opacity="0.08"/>
  <circle cx="98" cy="98" r="0.8" fill="#8b6914" opacity="0.15"/>
  <circle cx="50" cy="98" r="0.6" fill="#8b6914" opacity="0.08"/>
  <circle cx="0" cy="50" r="0.6" fill="#8b6914" opacity="0.08"/>
  <!-- Fine grain lines -->
  <line x1="12" y1="0" x2="12" y2="100" stroke="#3d2b1a" stroke-width="0.15" opacity="0.15"/>
  <line x1="37" y1="0" x2="37" y2="100" stroke="#3d2b1a" stroke-width="0.15" opacity="0.12"/>
  <line x1="63" y1="0" x2="63" y2="100" stroke="#3d2b1a" stroke-width="0.15" opacity="0.12"/>
  <line x1="88" y1="0" x2="88" y2="100" stroke="#3d2b1a" stroke-width="0.15" opacity="0.15"/>
</svg>
