<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="25%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#c49a1a"/>
      <stop offset="75%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#a0700a"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a34a"/>
      <stop offset="40%" stop-color="#cd7f32"/>
      <stop offset="100%" stop-color="#a0602a"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3520"/>
      <stop offset="100%" stop-color="#2a1f0e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f0d060" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0a0602" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#darkMetal)" stroke="url(#brassGrad)" stroke-width="2" filter="url(#dropShadow)"/>
  <circle cx="32" cy="32" r="28" fill="url(#centerGlow)"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#brassGrad)" stroke-width="0.5" stroke-dasharray="3 2"/>
  <!-- Large gear -->
  <g transform="translate(32,32)">
    <!-- Gear body -->
    <circle r="18" fill="none" stroke="url(#brassGrad)" stroke-width="2.5"/>
    <circle r="12" fill="none" stroke="#cd7f32" stroke-width="1.5"/>
    <circle r="5" fill="url(#copperGrad)" stroke="#d4a017" stroke-width="0.8"/>
    <circle r="3" fill="#e8c547" opacity="0.6"/>
    <!-- Large gear teeth (8 teeth) -->
    <g fill="url(#brassGrad)" stroke="#a0700a" stroke-width="0.3">
      <rect x="-4" y="-23" width="8" height="9" rx="1.5"/>
      <rect x="-4" y="14" width="8" height="9" rx="1.5"/>
      <rect x="-23" y="-4" width="9" height="8" rx="1.5"/>
      <rect x="14" y="-4" width="9" height="8" rx="1.5"/>
      <rect x="8" y="-20" width="8" height="9" rx="1.5" transform="rotate(45,12,-15.5)"/>
      <rect x="-16" y="-20" width="8" height="9" rx="1.5" transform="rotate(-45,-12,-15.5)"/>
      <rect x="8" y="11" width="8" height="9" rx="1.5" transform="rotate(-45,12,15.5)"/>
      <rect x="-16" y="11" width="8" height="9" rx="1.5" transform="rotate(45,-12,15.5)"/>
    </g>
    <!-- Inner spoke pattern -->
    <g opacity="0.4">
      <line x1="0" y1="-6" x2="0" y2="-15" stroke="#d4a017" stroke-width="1.5"/>
      <line x1="0" y1="6" x2="0" y2="15" stroke="#d4a017" stroke-width="1.5"/>
      <line x1="-6" y1="0" x2="-15" y2="0" stroke="#d4a017" stroke-width="1.5"/>
      <line x1="6" y1="0" x2="15" y2="0" stroke="#d4a017" stroke-width="1.5"/>
      <line x1="4.2" y1="-4.2" x2="10.6" y2="-10.6" stroke="#b8860b" stroke-width="1"/>
      <line x1="-4.2" y1="4.2" x2="-10.6" y2="10.6" stroke="#b8860b" stroke-width="1"/>
      <line x1="-4.2" y1="-4.2" x2="-10.6" y2="-10.6" stroke="#b8860b" stroke-width="1"/>
      <line x1="4.2" y1="4.2" x2="10.6" y2="10.6" stroke="#b8860b" stroke-width="1"/>
    </g>
  </g>
  <!-- Filigree swirls on corners -->
  <g opacity="0.6" fill="none" stroke="url(#brassGrad)" stroke-width="1" stroke-linecap="round">
    <path d="M8,8 Q16,4 12,16 Q8,12 8,8"/>
    <path d="M56,8 Q48,4 52,16 Q56,12 56,8"/>
    <path d="M8,56 Q16,60 12,48 Q8,52 8,56"/>
    <path d="M56,56 Q48,60 52,48 Q56,52 56,56"/>
  </g>
  <!-- Rivets at cardinal points -->
  <circle cx="32" cy="4" r="2" fill="url(#copperGrad)" stroke="#a0700a" stroke-width="0.3"/>
  <circle cx="32" cy="60" r="2" fill="url(#copperGrad)" stroke="#a0700a" stroke-width="0.3"/>
  <circle cx="4" cy="32" r="2" fill="url(#copperGrad)" stroke="#a0700a" stroke-width="0.3"/>
  <circle cx="60" cy="32" r="2" fill="url(#copperGrad)" stroke="#a0700a" stroke-width="0.3"/>
</svg>
