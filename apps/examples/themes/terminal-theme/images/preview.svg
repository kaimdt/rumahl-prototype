<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Terminal window frame -->
  <rect x="8" y="8" width="384" height="284" rx="0" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="8" y="8" width="384" height="22" fill="#1a1a1a"/>
  <circle cx="20" cy="20" r="4" fill="#ff5555"/>
  <circle cx="34" cy="20" r="4" fill="#f1fa8c"/>
  <circle cx="48" cy="20" r="4" fill="#50fa7b"/>
  <text x="200" y="22" text-anchor="middle" fill="#6272a4" font-family="monospace" font-size="9">iora@terminal — bash — 80×24</text>
  <!-- Prompt line 1 -->
  <text x="16" y="50" fill="#50fa7b" font-family="monospace" font-size="10" font-weight="bold">iora@home</text>
  <text x="88" y="50" fill="#f8f8f2" font-family="monospace" font-size="10">:~$ ./start-dashboard.sh</text>
  <!-- Cursor -->
  <rect x="230" y="40" width="7" height="12" fill="#50fa7b" opacity="0.8"/>
  <!-- Output -->
  <text x="16" y="66" fill="#6272a4" font-family="monospace" font-size="9">[INFO] Loading IORA Core......</text>
  <text x="16" y="78" fill="#50fa7b" font-family="monospace" font-size="9">[ OK ] IORA Home connected</text>
  <text x="16" y="90" fill="#50fa7b" font-family="monospace" font-size="9">[ OK ] 42 entities discovered</text>
  <text x="16" y="102" fill="#f1fa8c" font-family="monospace" font-size="9">[WARN] Living Room Light offline</text>
  <!-- Widget area -->
  <rect x="16" y="116" width="110" height="36" fill="#0d0d0d" stroke="#333" stroke-width="0.5"/>
  <text x="20" y="130" fill="#50fa7b" font-family="monospace" font-size="8">┌─ Light ─────────┐</text>
  <text x="20" y="140" fill="#f8f8f2" font-family="monospace" font-size="8">│ ● ON     ████ 85%│</text>
  <text x="20" y="148" fill="#6272a4" font-family="monospace" font-size="8">└────────────────┘</text>
  <rect x="134" y="116" width="110" height="36" fill="#0d0d0d" stroke="#333" stroke-width="0.5"/>
  <text x="138" y="130" fill="#50fa7b" font-family="monospace" font-size="8">┌─ Climate ───────┐</text>
  <text x="138" y="140" fill="#f8f8f2" font-family="monospace" font-size="8">│ 🌡 21.5° → 22.0°│</text>
  <text x="138" y="148" fill="#6272a4" font-family="monospace" font-size="8">└────────────────┘</text>
  <rect x="252" y="116" width="132" height="36" fill="#0d0d0d" stroke="#333" stroke-width="0.5"/>
  <text x="256" y="130" fill="#50fa7b" font-family="monospace" font-size="8">┌─ System ────────┐</text>
  <text x="256" y="140" fill="#f8f8f2" font-family="monospace" font-size="8">│ CPU 12% MEM 2.1G│</text>
  <text x="256" y="148" fill="#6272a4" font-family="monospace" font-size="8">└────────────────┘</text>
  <!-- Bottom prompt -->
  <text x="16" y="175" fill="#50fa7b" font-family="monospace" font-size="10" font-weight="bold">iora@home</text>
  <text x="88" y="175" fill="#f8f8f2" font-family="monospace" font-size="10">:~$ </text>
  <rect x="120" y="165" width="8" height="12" fill="#50fa7b" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Nav bar -->
  <rect x="16" y="195" width="368" height="28" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="24" y="213" fill="#50fa7b" font-family="monospace" font-size="8">[F1]Home</text>
  <text x="100" y="213" fill="#6272a4" font-family="monospace" font-size="8">[F2]Lights</text>
  <text x="176" y="213" fill="#6272a4" font-family="monospace" font-size="8">[F3]Climate</text>
  <text x="264" y="213" fill="#6272a4" font-family="monospace" font-size="8">[F4]Switches</text>
  <text x="340" y="213" fill="#f1fa8c" font-family="monospace" font-size="8">[ESC]Menu</text>
  <!-- Bottom status -->
  <rect x="8" y="292" width="384" height="0" fill="#333"/>
  <text x="16" y="286" fill="#444" font-family="monospace" font-size="7">0:00 0 errors</text>
  <text x="340" y="286" fill="#444" font-family="monospace" font-size="7">UTF-8 bash</text>
</svg>
