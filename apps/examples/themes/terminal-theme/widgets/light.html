<div class="theme-widget terminal-widget" data-widget-type="LIGHT" data-entity-id="{{entity_id}}">
  <span class="term-prompt">$</span> light --status {{entity_id}}
  <div class="term-output">
    <span class="term-label">{{friendly_name}}</span>
    <span class="term-value {{#if state_on}}term-on{{else}}term-off{{/if}}">[{{state}}]</span>
    {{#if brightness}}
    <span class="term-bar">[{{brightness_bar}}] {{brightness_pct}}%</span>
    {{/if}}
  </div>
</div>
