<div class="theme-widget terminal-widget" data-widget-type="WEATHER" data-entity-id="{{entity_id}}">
  <span class="term-prompt">$</span> weather --forecast
  <div class="term-output">
    <span class="term-label">{{friendly_name}}</span>
    <span class="term-temp">{{temperature}}°</span>
    <span class="term-condition">{{condition}}</span>
    <span class="term-detail">RH: {{humidity}}% Wind: {{wind_speed}} m/s</span>
  </div>
</div>
