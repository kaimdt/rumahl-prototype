<div class="theme-widget theme-widget-climate" data-entity-id="{{entity_id}}">
  <div class="theme-widget-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
    </svg>
  </div>
  <div class="theme-widget-content">
    <span class="theme-widget-label">{{friendly_name}}</span>
    <span class="theme-widget-temp">{{current_temperature}}°</span>
  </div>
  <div class="theme-widget-target">
    <span class="theme-widget-target-label">Target</span>
    <span class="theme-widget-target-value">{{temperature}}°</span>
  </div>
</div>
