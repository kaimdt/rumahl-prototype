<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0f172a"/>
      <rect width="40" height="40" fill="url(#gridCell)" opacity="0.06"/>
    </pattern>
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#06b6d4" opacity="0.12"/>
    </pattern>
    <linearGradient id="colDivider1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="colDivider2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="vizBar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="vizBar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="400" height="400" fill="#0f172a"/>
  <rect width="400" height="400" fill="url(#dotGrid)"/>
  <!-- Column dividers -->
  <rect x="92" y="0" width="1" height="400" fill="url(#colDivider1)"/>
  <rect x="306" y="0" width="1" height="400" fill="url(#colDivider2)"/>
  <!-- Row divider -->
  <rect x="0" y="32" width="400" height="1" fill="#334155" opacity="0.2"/>
  <!-- Data visualization motifs - column 1 -->
  <rect x="16" y="48" width="8" height="28" rx="2" fill="url(#vizBar1)"/>
  <rect x="28" y="56" width="8" height="20" rx="2" fill="url(#vizBar1)"/>
  <rect x="40" y="40" width="8" height="36" rx="2" fill="url(#vizBar2)"/>
  <rect x="52" y="52" width="8" height="24" rx="2" fill="url(#vizBar1)"/>
  <rect x="64" y="36" width="8" height="40" rx="2" fill="url(#vizBar2)"/>
  <!-- Line chart trace column 2 -->
  <polyline points="108,84 130,70 152,76 174,60 196,66 218,50 240,58 262,44 284,48 296,38"
    fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>
  <polyline points="108,94 130,82 152,86 174,74 196,78 218,66 240,70 262,58 284,62 296,54"
    fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.15"/>
  <!-- Small cards row -->
  <rect x="108" y="98" width="54" height="30" rx="6" fill="#1e293b" opacity="0.4"/>
  <circle cx="124" cy="113" r="5" fill="#06b6d4" opacity="0.2"/>
  <rect x="134" y="109" width="20" height="3" rx="1.5" fill="#94a3b8" opacity="0.3"/>
  <rect x="134" y="116" width="14" height="2.5" rx="1.25" fill="#64748b" opacity="0.2"/>
  <rect x="168" y="98" width="54" height="30" rx="6" fill="#1e293b" opacity="0.4"/>
  <circle cx="184" cy="113" r="5" fill="#14b8a6" opacity="0.2"/>
  <rect x="194" y="109" width="20" height="3" rx="1.5" fill="#94a3b8" opacity="0.3"/>
  <rect x="194" y="116" width="18" height="2.5" rx="1.25" fill="#64748b" opacity="0.2"/>
  <rect x="228" y="98" width="54" height="30" rx="6" fill="#1e293b" opacity="0.4"/>
  <circle cx="244" cy="113" r="5" fill="#06b6d4" opacity="0.2"/>
  <rect x="254" y="109" width="20" height="3" rx="1.5" fill="#94a3b8" opacity="0.3"/>
  <rect x="254" y="116" width="12" height="2.5" rx="1.25" fill="#64748b" opacity="0.2"/>
  <!-- Column 3 - right sidebar hints -->
  <rect x="316" y="48" width="62" height="6" rx="3" fill="#1e293b" opacity="0.4"/>
  <rect x="316" y="62" width="62" height="6" rx="3" fill="#1e293b" opacity="0.4"/>
  <rect x="316" y="76" width="48" height="6" rx="3" fill="#1e293b" opacity="0.4"/>
  <rect x="316" y="90" width="56" height="6" rx="3" fill="#1e293b" opacity="0.4"/>
  <!-- Circular progress indicators -->
  <circle cx="350" cy="120" r="14" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>
  <circle cx="350" cy="120" r="14" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.35"
    stroke-dasharray="58 30" stroke-linecap="round" transform="rotate(-90 350 120)"/>
  <circle cx="350" cy="168" r="14" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.2"/>
  <circle cx="350" cy="168" r="14" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.35"
    stroke-dasharray="45 43" stroke-linecap="round" transform="rotate(-90 350 168)"/>
  <!-- Bottom section - wide panel -->
  <rect x="108" y="152" width="282" height="62" rx="10" fill="#1e293b" opacity="0.25" stroke="#334155" stroke-width="0.5"/>
  <rect x="122" y="164" width="100" height="12" rx="4" fill="#06b6d4" opacity="0.12"/>
  <rect x="122" y="180" width="140" height="8" rx="3" fill="#14b8a6" opacity="0.08"/>
  <rect x="122" y="192" width="80" height="8" rx="3" fill="#334155" opacity="0.4"/>
  <!-- Grid accent lines -->
  <rect x="0" y="230" width="400" height="1" fill="#06b6d4" opacity="0.04"/>
  <rect x="0" y="310" width="400" height="1" fill="#14b8a6" opacity="0.04"/>
</svg>