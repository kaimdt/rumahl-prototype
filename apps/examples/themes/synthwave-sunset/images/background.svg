<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120B20"/>
      <stop offset="50%" stop-color="#1F1430"/>
      <stop offset="80%" stop-color="#2D1540"/>
      <stop offset="100%" stop-color="#3A1035"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E8396A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1F1430" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="5" x2="60" y2="5" stroke="#463D5A" stroke-width="0.4" opacity="0.3"/>
      <line x1="0" y1="55" x2="60" y2="55" stroke="#463D5A" stroke-width="0.4" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#463D5A" stroke-width="0.3" opacity="0.25"/>
      <line x1="30" y1="0" x2="30" y2="30" stroke="#463D5A" stroke-width="0.3" opacity="0.25"/>
      <line x1="60" y1="0" x2="60" y2="30" stroke="#463D5A" stroke-width="0.3" opacity="0.25"/>
      <line x1="0" y1="30" x2="5" y2="60" stroke="#463D5A" stroke-width="0.25" opacity="0.2"/>
      <line x1="15" y1="30" x2="17" y2="60" stroke="#463D5A" stroke-width="0.25" opacity="0.2"/>
      <line x1="30" y1="30" x2="30" y2="60" stroke="#463D5A" stroke-width="0.25" opacity="0.2"/>
      <line x1="45" y1="30" x2="43" y2="60" stroke="#463D5A" stroke-width="0.25" opacity="0.2"/>
      <line x1="60" y1="30" x2="55" y2="60" stroke="#463D5A" stroke-width="0.25" opacity="0.2"/>
    </pattern>
    <pattern id="triangles" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <polygon points="20,10 5,35 35,35" fill="none" stroke="#E8396A" stroke-width="0.4" opacity="0.12"/>
      <polygon points="60,50 45,75 75,75" fill="none" stroke="#00D4C8" stroke-width="0.4" opacity="0.1"/>
      <polygon points="40,70 30,55 50,55" fill="none" stroke="#E8396A" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <pattern id="stars" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#FFFFFF" opacity="0.4"/>
      <circle cx="35" cy="5" r="0.4" fill="#FFFFFF" opacity="0.25"/>
      <circle cx="25" cy="20" r="0.5" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="5" cy="35" r="0.7" fill="#FFFFFF" opacity="0.45"/>
      <circle cx="40" cy="30" r="0.5" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="15" cy="45" r="0.4" fill="#FFFFFF" opacity="0.2"/>
      <circle cx="45" cy="45" r="0.6" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="30" cy="40" r="0.3" fill="#FFFFFF" opacity="0.2"/>
    </pattern>
    <pattern id="stripes" x="0" y="0" width="200" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="4" fill="#E8396A" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#sunsetSky)"/>
  <rect width="400" height="400" fill="url(#sunGrad)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#triangles)"/>
  <rect width="400" height="200" fill="url(#stars)"/>
  <rect width="400" height="400" fill="url(#stripes)"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#E8396A" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="302" x2="400" y2="302" stroke="#00D4C8" stroke-width="0.5" opacity="0.08"/>
  <rect x="0" y="300" width="400" height="100" fill="#1A1030" opacity="0.3"/>
</svg>