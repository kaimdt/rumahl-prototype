<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="40%" stop-color="#2d1b69"/>
      <stop offset="70%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Sun grid -->
  <rect x="120" y="150" width="160" height="1" fill="#ff6b35" opacity="0.3"/>
  <rect x="120" y="155" width="160" height="1" fill="#ff6b35" opacity="0.2"/>
  <rect x="120" y="160" width="160" height="1" fill="#ff6b35" opacity="0.15"/>
  <rect x="120" y="165" width="160" height="1" fill="#ff6b35" opacity="0.1"/>
  <!-- Neon triangle sun -->
  <polygon points="200,130 220,175 180,175" fill="#ffd700" opacity="0.6" filter="url(#glow)"/>
  <!-- Ground grid -->
  <rect x="0" y="200" width="400" height="100" fill="#120024" opacity="0.8"/>
  <rect x="0" y="200" width="400" height="1" fill="url(#neonLine)" opacity="0.4"/>
  <rect x="0" y="210" width="400" height="1" fill="#ff00ff" opacity="0.1"/>
  <rect x="0" y="230" width="400" height="1" fill="#00ffff" opacity="0.08"/>
  <rect x="0" y="260" width="400" height="1" fill="#ff00ff" opacity="0.06"/>
  <!-- Cards -->
  <rect x="20" y="210" width="110" height="55" rx="4" fill="#1a0533" stroke="#ff00ff" stroke-width="1" opacity="0.9"/>
  <rect x="28" y="218" width="50" height="4" rx="2" fill="#ff00ff" opacity="0.6"/>
  <rect x="28" y="227" width="70" height="3" rx="1.5" fill="#ff6b35" opacity="0.3"/>
  <rect x="28" y="235" width="50" height="3" rx="1.5" fill="#ff6b35" opacity="0.2"/>
  <rect x="145" y="210" width="110" height="55" rx="4" fill="#1a0533" stroke="#00ffff" stroke-width="1" opacity="0.9"/>
  <rect x="153" y="218" width="50" height="4" rx="2" fill="#00ffff" opacity="0.6"/>
  <rect x="153" y="227" width="60" height="3" rx="1.5" fill="#ffd700" opacity="0.3"/>
  <rect x="153" y="235" width="40" height="3" rx="1.5" fill="#ffd700" opacity="0.2"/>
  <rect x="270" y="210" width="110" height="55" rx="4" fill="#1a0533" stroke="#ff00ff" stroke-width="1" opacity="0.9"/>
  <rect x="278" y="218" width="50" height="4" rx="2" fill="#ff00ff" opacity="0.6"/>
  <rect x="278" y="227" width="65" height="3" rx="1.5" fill="#ff6b35" opacity="0.3"/>
  <rect x="278" y="235" width="45" height="3" rx="1.5" fill="#ff6b35" opacity="0.2"/>
  <!-- Label -->
  <text x="200" y="100" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="700" letter-spacing="10" filter="url(#glow)">SYNTHWAVE</text>
</svg>
