<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cornerGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Clean geometric corner -->
  <!-- L-shape brackets -->
  <path d="M0,0 L80,0" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  <path d="M0,0 L0,80" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  <path d="M0,4 L50,4" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <path d="M4,0 L4,50" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <!-- Gradient corner sweep -->
  <path d="M0,0 Q50,0 50,50 Q50,100 0,100" fill="none" stroke="url(#cornerGrad1)" stroke-width="1.5" opacity="0.5"/>
  <path d="M0,0 Q35,0 35,35 Q35,70 0,70" fill="none" stroke="url(#cornerGrad2)" stroke-width="1" opacity="0.4"/>
  <!-- Dot markers -->
  <circle cx="30" cy="4" r="1.5" fill="#818cf8" opacity="0.3"/>
  <circle cx="4" cy="30" r="1.5" fill="#818cf8" opacity="0.3"/>
  <circle cx="60" cy="4" r="1" fill="#6366f1" opacity="0.2"/>
  <circle cx="4" cy="60" r="1" fill="#6366f1" opacity="0.2"/>
  <!-- Small menu element in corner -->
  <rect x="6" y="6" width="28" height="22" rx="5" fill="#151530" opacity="0.5" stroke="#2d2d5e" stroke-width="0.4"/>
  <rect x="10" y="10" width="20" height="3" rx="1.5" fill="#818cf8" opacity="0.25"/>
  <rect x="10" y="16" width="14" height="2" rx="1" fill="#4a4a8a" opacity="0.3"/>
  <rect x="10" y="21" width="18" height="2" rx="1" fill="#4a4a8a" opacity="0.25"/>
  <!-- Subtle radial lines -->
  <line x1="10" y1="0" x2="80" y2="70" stroke="#818cf8" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="10" x2="70" y2="80" stroke="#6366f1" stroke-width="0.3" opacity="0.08"/>
  <line x1="20" y1="0" x2="100" y2="80" stroke="#818cf8" stroke-width="0.2" opacity="0.05"/>
  <line x1="0" y1="20" x2="80" y2="100" stroke="#6366f1" stroke-width="0.2" opacity="0.05"/>
</svg>