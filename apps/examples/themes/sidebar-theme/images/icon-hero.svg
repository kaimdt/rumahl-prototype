  <!-- Content header -->
  <rect x="58" y="20" width="52" height="12" rx="6" fill="#151530" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="68" cy="26" r="3" fill="#818cf8" opacity="0.7"/>
  <!-- Content cards -->
  <rect x="58" y="40" width="24" height="24" rx="6" fill="#151530" stroke="#2d2d5e" stroke-width="0.4"/>
  <circle cx="70" cy="52" r="5" fill="#818cf8" opacity="0.25"/>
  <rect x="88" y="40" width="24" height="24" rx="6" fill="#151530" stroke="#2d2d5e" stroke-width="0.4"/>
  <circle cx="100" cy="52" r="5" fill="#8b5cf6" opacity="0.25"/>
  <rect x="58" y="72" width="52" height="20" rx="6" fill="#151530" stroke="#2d2d5e" stroke-width="0.4"/>
  <!-- Chart trace mini -->
  <polyline points="66,84 76,80 86,82 96,76 106,78" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <!-- Active indicator -->
  <circle cx="108" cy="84" r="3" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <!-- Bottom section -->
  <rect x="58" y="100" width="52" height="8" rx="3" fill="#151530" opacity="0.4"/>
