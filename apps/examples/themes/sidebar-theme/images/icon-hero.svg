<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="menuAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Sidebar panel -->
  <rect x="12" y="12" width="32" height="104" rx="10" fill="#0f0f23" stroke="url(#heroGrad)" stroke-width="1.5" opacity="0.9"/>
  <!-- Menu items -->
  <rect x="20" y="24" width="16" height="5" rx="2.5" fill="url(#menuAccent)"/>
  <rect x="20" y="38" width="12" height="4" rx="2" fill="#4a4a8a" opacity="0.4"/>
  <rect x="20" y="50" width="15" height="4" rx="2" fill="#4a4a8a" opacity="0.4"/>
  <rect x="20" y="62" width="10" height="4" rx="2" fill="#4a4a8a" opacity="0.4"/>
  <rect x="20" y="74" width="14" height="4" rx="2" fill="#4a4a8a" opacity="0.4"/>
  <!-- Divider -->
  <rect x="22" y="88" width="12" height="0.5" fill="#2d2d5e" opacity="0.5"/>
  <!-- Bottom menu items -->
  <rect x="20" y="96" width="11" height="4" rx="2" fill="#4a4a8a" opacity="0.3"/>
  <rect x="20" y="106" width="8" height="4" rx="2" fill="#4a4a8a" opacity="0.25"/>
  <!-- Main content area -->
