<div class="theme-widget theme-widget-light" data-entity-id="{{entity_id}}">
  <div class="theme-widget-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </div>
  <div class="theme-widget-content">
    <span class="theme-widget-label">{{friendly_name}}</span>
    <span class="theme-widget-state">{{state}}</span>
  </div>
  <div class="theme-widget-control">
    <div class="theme-widget-slider">
      <div class="theme-widget-slider-fill" style="width: {{brightness_pct}}%"></div>
    </div>
  </div>
</div>
