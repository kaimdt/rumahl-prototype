<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="oceanCorner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentLineV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main corner border - inverted L -->
  <path d="M0,0 L60,0 L60,2.5 L2.5,2.5 L2.5,60 L0,60 Z" fill="url(#oceanCorner)" filter="url(#softGlow)"/>
  <!-- Horizontal accent line -->
  <line x1="65" y1="1.25" x2="115" y2="1.25" stroke="url(#accentLine)" stroke-width="1" opacity="0.5"/>
  <!-- Vertical accent line -->
  <line x1="1.25" y1="65" x2="1.25" y2="115" stroke="url(#accentLineV)" stroke-width="1" opacity="0.5"/>
  <!-- Wave ornament -->
  <g filter="url(#softGlow)" opacity="0.7">
    <path d="M6,45 Q18,36 28,45 Q38,54 48,45" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6,52 Q18,44 28,52 Q38,60 48,52" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M45,6 Q36,18 45,28 Q54,38 45,48" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M52,6 Q44,18 52,28 Q60,38 52,48" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Bubbles -->
  <circle cx="30" cy="30" r="4" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <circle cx="30" cy="30" r="1.5" fill="#06b6d4" opacity="0.2"/>
  <circle cx="15" cy="20" r="3" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
  <circle cx="15" cy="20" r="1.2" fill="#3b82f6" opacity="0.15"/>
  <circle cx="42" cy="16" r="2.5" fill="none" stroke="#06b6d4" stroke-width="0.6" opacity="0.35"/>
  <circle cx="42" cy="16" r="1" fill="#06b6d4" opacity="0.12"/>
  <circle cx="16" cy="42" r="2.5" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.35"/>
  <circle cx="16" cy="42" r="1" fill="#3b82f6" opacity="0.12"/>
  <!-- Dot accents -->
  <circle cx="35" cy="35" r="1.5" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="10" r="1" fill="#06b6d4" opacity="0.25"/>
  <circle cx="10" cy="50" r="1" fill="#06b6d4" opacity="0.25"/>
  <circle cx="55" cy="5" r="1.5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="5" cy="55" r="1.5" fill="#3b82f6" opacity="0.2"/>
</svg>
