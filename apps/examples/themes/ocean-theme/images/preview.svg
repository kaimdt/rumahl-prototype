<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d2847"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Waves -->
  <path d="M0 200 Q50 180 100 200 T200 200 T300 200 T400 200 L400 300 L0 300Z" fill="#1e3a5f" opacity="0.5"/>
  <path d="M0 220 Q50 200 100 220 T200 220 T300 220 T400 220 L400 300 L0 300Z" fill="#0f2744" opacity="0.6"/>
  <path d="M0 250 Q50 235 100 250 T200 250 T300 250 T400 250 L400 300 L0 300Z" fill="#061220" opacity="0.7"/>
  <!-- Bubbles -->
  <circle cx="50" cy="160" r="6" fill="url(#accent)" opacity="0.3"/>
  <circle cx="120" cy="130" r="4" fill="url(#accent)" opacity="0.2"/>
  <circle cx="310" cy="140" r="5" fill="url(#accent)" opacity="0.25"/>
  <circle cx="260" cy="100" r="3" fill="url(#accent)" opacity="0.15"/>
  <!-- Center card preview -->
  <rect x="120" y="80" width="160" height="60" rx="12" fill="#122544" stroke="#1e3a5f" stroke-width="0.5" opacity="0.8"/>
  <circle cx="145" cy="110" r="10" fill="#3b82f6" opacity="0.6"/>
  <text x="165" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10">Ocean Widget</text>
  <text x="165" y="128" fill="#64748b" font-family="monospace" font-size="7">Active</text>
  <!-- Text label -->
  <text x="200" y="290" text-anchor="middle" fill="#64748b" font-family="serif" font-size="11" letter-spacing="4">OCEAN BLUE</text>
</svg>
