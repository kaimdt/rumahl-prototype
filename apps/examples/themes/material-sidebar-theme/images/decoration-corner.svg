<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cornerAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cornerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d2d5e" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cornerLineV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d2d5e" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="elevationShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="accentGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main corner shape - inverted L with rounded outer -->
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="url(#cornerAccent)" filter="url(#elevationShadow)"/>
  <!-- Inner highlight line -->
  <path d="M3,3 L47,3 L47,5 L5,5 L5,47 L3,47 Z" fill="none" stroke="#818cf8" stroke-width="0.5" opacity="0.25"/>
  <!-- Horizontal extension line -->
  <line x1="54" y1="2" x2="115" y2="2" stroke="url(#cornerLine)" stroke-width="0.8" opacity="0.4"/>
  <!-- Vertical extension line -->
  <line x1="2" y1="54" x2="2" y2="115" stroke="url(#cornerLineV)" stroke-width="0.8" opacity="0.4"/>
  <!-- Geometric decoration - nested rounded rects -->
  <rect x="12" y="12" width="28" height="28" rx="6" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.25" filter="url(#accentGlow)"/>
  <rect x="16" y="16" width="20" height="20" rx="4" fill="none" stroke="#8b5cf6" stroke-width="0.6" opacity="0.2"/>
  <rect x="20" y="20" width="12" height="12" rx="3" fill="#6366f1" opacity="0.15"/>
  <!-- Ripple circles from corner -->
  <circle cx="0" cy="0" r="25" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.12"/>
  <circle cx="0" cy="0" r="40" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.08"/>
  <circle cx="0" cy="0" r="60" fill="none" stroke="#6366f1" stroke-width="0.2" opacity="0.05"/>
  <!-- Dot accents on extensions -->
  <circle cx="70" cy="2" r="1.5" fill="#6366f1" opacity="0.2"/>
  <circle cx="90" cy="2" r="1" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="108" cy="2" r="0.8" fill="#6366f1" opacity="0.1"/>
  <circle cx="2" cy="70" r="1.5" fill="#6366f1" opacity="0.2"/>
  <circle cx="2" cy="90" r="1" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="2" cy="108" r="0.8" fill="#6366f1" opacity="0.1"/>
  <!-- Small elevation card near corner -->
  <rect x="42" y="42" width="16" height="16" rx="4" fill="#1e1e3a" opacity="0.4"/>
  <rect x="42" y="42" width="16" height="16" rx="4" fill="none" stroke="#2d2d5e" stroke-width="0.5" opacity="0.3"/>
  <rect x="46" y="46" width="8" height="2" rx="1" fill="#6366f1" opacity="0.15"/>
  <rect x="46" y="50" width="6" height="1.5" rx="0.75" fill="#8b5cf6" opacity="0.1"/>
</svg>
