<div class="theme-widget theme-widget-sensor" data-entity-id="{{entity_id}}">
  <div class="theme-widget-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
  </div>
  <div class="theme-widget-content">
    <span class="theme-widget-label">{{friendly_name}}</span>
    <span class="theme-widget-value">{{state}} {{unit}}</span>
  </div>
  <div class="theme-widget-graph">
    <div class="theme-widget-graph-bar" style="width: {{value_pct}}%"></div>
  </div>
</div>
