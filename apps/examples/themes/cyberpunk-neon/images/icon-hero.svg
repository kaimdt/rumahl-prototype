<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="neonPinkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="neonPurpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b44dff"/>
      <stop offset="100%" stop-color="#8b2cf5"/>
    </linearGradient>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="combinedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Hexagonal outer frame -->
  <polygon points="64,8 104,30 104,74 64,96 24,74 24,30" fill="#0a0a0f" stroke="url(#neonPinkGrad)" stroke-width="1.5" opacity="0.8" filter="url(#pinkGlow)"/>
  <!-- Inner circuit paths -->
  <!-- Central chip -->
  <rect x="46" y="42" width="36" height="24" rx="3" fill="#0d0d1a" stroke="url(#neonCyanGrad)" stroke-width="1" opacity="0.9" filter="url(#cyanGlow)"/>
  <rect x="52" y="48" width="24" height="12" rx="2" fill="#00f0ff" opacity="0.12"/>
  <!-- Circuit traces from chip - top -->
  <line x1="64" y1="42" x2="64" y2="28" stroke="url(#neonPinkGrad)" stroke-width="1" opacity="0.5" filter="url(#pinkGlow)"/>
  <!-- Circuit traces from chip - bottom -->
  <line x1="52" y1="66" x2="52" y2="84" stroke="url(#neonCyanGrad)" stroke-width="0.8" opacity="0.4"/>
  <line x1="64" y1="66" x2="64" y2="88" stroke="url(#neonPurpleGrad)" stroke-width="0.8" opacity="0.4"/>
  <line x1="76" y1="66" x2="76" y2="84" stroke="url(#neonCyanGrad)" stroke-width="0.8" opacity="0.4"/>
  <!-- Circuit traces from chip - left -->
  <line x1="46" y1="54" x2="32" y2="54" stroke="url(#neonPinkGrad)" stroke-width="0.8" opacity="0.4" filter="url(#pinkGlow)"/>
  <!-- Circuit traces from chip - right -->
  <line x1="82" y1="54" x2="96" y2="54" stroke="url(#neonCyanGrad)" stroke-width="0.8" opacity="0.4"/>
  <!-- Trace endpoints -->
  <circle cx="64" cy="26" r="2.5" fill="none" stroke="#ff2d95" stroke-width="1" opacity="0.6" filter="url(#pinkGlow)"/>
  <circle cx="52" cy="86" r="2" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="76" cy="86" r="2" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="64" cy="90" r="2.5" fill="none" stroke="#b44dff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="30" cy="54" r="2" fill="none" stroke="#ff2d95" stroke-width="0.8" opacity="0.5" filter="url(#pinkGlow)"/>
  <circle cx="98" cy="54" r="2" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.5"/>
  <!-- Diagonal traces -->
  <line x1="46" y1="48" x2="36" y2="38" stroke="#b44dff" stroke-width="0.5" opacity="0.25"/>
  <line x1="82" y1="48" x2="92" y2="38" stroke="#b44dff" stroke-width="0.5" opacity="0.25"/>
  <line x1="46" y1="60" x2="36" y2="70" stroke="#ff2d95" stroke-width="0.5" opacity="0.2"/>
  <line x1="82" y1="60" x2="92" y2="70" stroke="#ff2d95" stroke-width="0.5" opacity="0.2"/>
  <!-- Glitch accent -->
  <rect x="70" y="38" width="12" height="2" fill="url(#neonCyanGrad)" opacity="0.5" transform="translate(1,0)"/>
  <rect x="46" y="68" width="16" height="1.5" fill="url(#neonPinkGrad)" opacity="0.4"/>
  <!-- Corner neon dots -->
  <circle cx="64" cy="10" r="1.5" fill="#ff2d95" opacity="0.3" filter="url(#combinedGlow)"/>
  <circle cx="104" cy="30" r="1.5" fill="#00f0ff" opacity="0.25"/>
  <circle cx="104" cy="74" r="1.5" fill="#00f0ff" opacity="0.25"/>
  <circle cx="64" cy="98" r="1.5" fill="#b44dff" opacity="0.25"/>
  <circle cx="24" cy="74" r="1.5" fill="#ff2d95" opacity="0.25"/>
  <circle cx="24" cy="30" r="1.5" fill="#00f0ff" opacity="0.25"/>
</svg>