<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="neonPinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="neonPurpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b44dff"/>
      <stop offset="100%" stop-color="#8b2cf5"/>
    </linearGradient>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Corner neon L-shape tubes -->
  <rect x="0" y="4" width="100" height="4" rx="2" fill="url(#neonPinkGrad)" opacity="0.5" filter="url(#pinkGlow)"/>
  <rect x="0" y="4" width="100" height="2" rx="1" fill="#ff6b9d" opacity="0.3"/>
  <rect x="4" y="0" width="4" height="100" rx="2" fill="url(#neonCyanGrad)" opacity="0.5" filter="url(#cyanGlow)"/>
  <rect x="4" y="0" width="2" height="100" rx="1" fill="#00d4ff" opacity="0.3"/>
  <!-- Corner junction glow -->
  <circle cx="6" cy="6" r="6" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.4" filter="url(#heavyGlow)"/>
  <circle cx="6" cy="6" r="3" fill="#ff2d95" opacity="0.25" filter="url(#pinkGlow)"/>
  <!-- Secondary neon traces -->
  <rect x="0" y="16" width="60" height="1.5" rx="0.75" fill="url(#neonPurpleGrad)" opacity="0.2"/>
  <rect x="16" y="0" width="1.5" height="60" rx="0.75" fill="url(#neonPurpleGrad)" opacity="0.2"/>
  <!-- Circuit traces from corner -->
  <polyline points="10,12 20,12 20,30 40,30 40,20 60,20" fill="none" stroke="#ff2d95" stroke-width="0.7" opacity="0.3" filter="url(#pinkGlow)"/>
  <polyline points="12,10 12,20 30,20 30,40 20,40 20,60" fill="none" stroke="#00f0ff" stroke-width="0.7" opacity="0.28" filter="url(#cyanGlow)"/>
  <polyline points="14,14 26,14 26,26 44,26 44,14 58,14" fill="none" stroke="#b44dff" stroke-width="0.5" opacity="0.18"/>
  <!-- Circuit nodes -->
  <circle cx="60" cy="20" r="2" fill="none" stroke="#ff2d95" stroke-width="0.8" opacity="0.4" filter="url(#pinkGlow)"/>
  <circle cx="20" cy="60" r="2" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.38" filter="url(#cyanGlow)"/>
  <circle cx="58" cy="14" r="1.5" fill="none" stroke="#b44dff" stroke-width="0.6" opacity="0.25"/>
  <!-- Hex grid nodes near corner -->
  <polygon points="6,40 14,44 14,52 6,56 -2,52 -2,44" fill="none" stroke="#ff2d95" stroke-width="0.5" opacity="0.12"/>
  <polygon points="40,6 44,14 52,14 56,6 52,-2 44,-2" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.12"/>
  <!-- Glitch displacements -->
  <rect x="0" y="70" width="40" height="1.5" fill="url(#neonCyanGrad)" opacity="0.15"/>
  <rect x="4" y="76" width="30" height="1" fill="url(#neonPinkGrad)" opacity="0.1"/>
  <rect x="70" y="0" width="1.5" height="40" fill="url(#neonPinkGrad)" opacity="0.12"/>
  <rect x="78" y="2" width="1" height="28" fill="url(#neonCyanGrad)" opacity="0.1"/>
  <!-- Tiny digital noise dots -->
  <rect x="8" y="62" width="1" height="1" fill="#00f0ff" opacity="0.12"/>
  <rect x="14" y="66" width="1" height="1" fill="#ff2d95" opacity="0.1"/>
  <rect x="22" y="58" width="1" height="1" fill="#b44dff" opacity="0.08"/>
  <rect x="62" y="8" width="1" height="1" fill="#00f0ff" opacity="0.12"/>
  <rect x="66" y="14" width="1" height="1" fill="#ff2d95" opacity="0.1"/>
  <rect x="58" y="22" width="1" height="1" fill="#b44dff" opacity="0.08"/>
  <!-- Diagonal glitch lines -->
  <line x1="2" y1="80" x2="40" y2="96" stroke="#ff2d95" stroke-width="0.4" opacity="0.08"/>
  <line x1="80" y1="2" x2="96" y2="40" stroke="#00f0ff" stroke-width="0.4" opacity="0.08"/>
</svg>