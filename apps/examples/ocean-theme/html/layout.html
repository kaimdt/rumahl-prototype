<div class="theme-layout" data-theme-layout="root">
  <div data-slot="background" class="theme-background-slot"></div>
  <div class="theme-app-shell">
    <header data-slot="header" class="theme-header-slot"></header>
    <div class="theme-body">
      <aside data-slot="navigation" class="theme-nav-slot"></aside>
      <main data-slot="content" class="theme-content-slot"></main>
      <aside data-slot="sidebar" class="theme-sidebar-slot"></aside>
    </div>
    <footer data-slot="status-bar" class="theme-status-slot"></footer>
  </div>
  <div data-slot="toast" class="theme-toast-slot"></div>
  <div data-slot="assistant" class="theme-assistant-slot"></div>
</div>
