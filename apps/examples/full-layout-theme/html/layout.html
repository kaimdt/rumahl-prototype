<!DOCTYPE html>
<div class="full-layout-theme" style="
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 240px 1fr 280px;
  grid-template-areas:
    'header header header'
    'nav content sidebar';
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--background, oklch(0.18 0.02 260));
  color: var(--foreground, oklch(0.85 0.015 260));
  font-family: var(--font-primary, 'Inter', sans-serif);
">
  <!-- Header spans full width -->
  <header 
    data-slot="header" 
    style="grid-area: header; z-index: 40;"
  ></header>

  <!-- Left sidebar navigation -->
  <nav 
    data-slot="navigation" 
    style="grid-area: nav; z-index: 30; overflow-y: auto; border-right: 1px solid var(--border); background: oklch(from var(--card) l c h / 0.6); backdrop-filter: blur(20px);"
  ></nav>

  <!-- Main content area -->
  <main 
    data-slot="content" 
    style="grid-area: content; overflow-y: auto; padding: 1.5rem;"
  ></main>

  <!-- Right sidebar (optional, for status, info panels) -->
  <aside 
    data-slot="sidebar" 
    style="grid-area: sidebar; z-index: 30; overflow-y: auto; border-left: 1px solid var(--border); padding: 1rem;"
  ></aside>

  <!-- Status bar at bottom of main area -->
  <div 
    data-slot="status-bar" 
    style="grid-area: content; align-self: end; z-index: 35;"
  ></div>
</div>

<style>
  /* Responsive: collapse sidebars on smaller screens */
  @media (max-width: 1024px) {
    .full-layout-theme {
      grid-template-columns: 200px 1fr !important;
      grid-template-areas:
        'header header'
        'nav content' !important;
    }
    .full-layout-theme aside[data-slot] {
      display: none;
    }
  }

  @media (max-width: 768px) {
    .full-layout-theme {
      grid-template-columns: 1fr !important;
      grid-template-rows: auto 1fr auto !important;
      grid-template-areas:
        'header'
        'content'
        'nav' !important;
    }
  }
</style>
