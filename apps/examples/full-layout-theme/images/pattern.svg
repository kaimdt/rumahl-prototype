<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="microDot" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.6" fill="#06b6d4" opacity="0.06"/>
    </pattern>
    <pattern id="subtleLine" x="0" y="0" width="120" height="1" patternUnits="userSpaceOnUse">
      <rect width="120" height="1" fill="#334155" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Base transparent -->
  <rect width="120" height="120" fill="none"/>
  <!-- Micro dot overlay -->
  <rect width="120" height="120" fill="url(#microDot)"/>
  <!-- Subtle horizontal rule every 30px -->
  <rect y="30" width="120" height="0.5" fill="#06b6d4" opacity="0.05"/>
  <rect y="60" width="120" height="0.5" fill="#14b8a6" opacity="0.05"/>
  <rect y="90" width="120" height="0.5" fill="#06b6d4" opacity="0.05"/>
  <!-- Corner accents (for tiling hint) -->
  <rect x="0" y="0" width="4" height="4" fill="none"/>
</svg>