<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Outer dashboard frame -->
  <rect x="12" y="16" width="104" height="96" rx="14" fill="#0f172a" stroke="url(#heroGrad)" stroke-width="1.5" opacity="0.9"/>
  <!-- Top bar -->
  <rect x="24" y="28" width="80" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <circle cx="36" cy="34" r="3" fill="#06b6d4" opacity="0.8"/>
  <rect x="44" y="31" width="16" height="6" rx="3" fill="#67e8f9" opacity="0.5"/>
  <!-- Left column panel -->
  <rect x="24" y="48" width="36" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5" opacity="0.8"/>
  <!-- Mini bar chart left -->
  <rect x="32" y="80" width="5" height="12" rx="1.5" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="40" y="74" width="5" height="18" rx="1.5" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="48" y="68" width="5" height="24" rx="1.5" fill="url(#barGrad)" opacity="0.7"/>
  <!-- Right column panel -->
  <rect x="68" y="48" width="36" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5" opacity="0.8"/>
  <!-- Line chart mini -->
  <polyline points="72,88 80,78 88,82 96,72" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="72" cy="88" r="2" fill="#14b8a6" opacity="0.8"/>
  <circle cx="80" cy="78" r="2" fill="#14b8a6" opacity="0.8"/>
  <circle cx="88" cy="82" r="2" fill="#14b8a6" opacity="0.8"/>
  <circle cx="96" cy="72" r="2" fill="#14b8a6" opacity="0.8"/>
  <!-- Accent dots at bottom -->
  <rect x="24" y="108" width="80" height="1" fill="url(#heroGrad)" opacity="0.2"/>
  <circle cx="80" cy="118" r="2" fill="#06b6d4" opacity="0.5"/>
  <circle cx="88" cy="118" r="2" fill="#14b8a6" opacity="0.5"/>
  <circle cx="96" cy="118" r="2" fill="#06b6d4" opacity="0.3"/>
</svg>