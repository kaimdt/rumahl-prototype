<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cornerGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Top-left corner oriented, axes extending right and down -->
  <!-- Main corner arc -->
  <path d="M0,0 L200,0 L200,200 L0,200 Z" fill="none"/>
  <!-- Outer gradient sweep -->
  <path d="M0,0 Q80,0 80,80 Q80,160 0,160" fill="none" stroke="url(#cornerGrad1)" stroke-width="1.5" opacity="0.6"/>
  <path d="M0,0 Q60,0 60,60 Q60,120 0,120" fill="none" stroke="url(#cornerGrad2)" stroke-width="1" opacity="0.5"/>
  <!-- Horizontal accent lines -->
  <line x1="0" y1="40" x2="100" y2="40" stroke="#06b6d4" stroke-width="0.6" opacity="0.15"/>
  <line x1="0" y1="70" x2="70" y2="70" stroke="#14b8a6" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="100" x2="50" y2="100" stroke="#06b6d4" stroke-width="0.4" opacity="0.08"/>
  <!-- Vertical accent lines -->
  <line x1="40" y1="0" x2="40" y2="100" stroke="#06b6d4" stroke-width="0.6" opacity="0.15"/>
  <line x1="70" y1="0" x2="70" y2="70" stroke="#14b8a6" stroke-width="0.5" opacity="0.12"/>
  <line x1="100" y1="0" x2="100" y2="50" stroke="#06b6d4" stroke-width="0.4" opacity="0.08"/>
  <!-- Corner dot grid -->
  <circle cx="20" cy="20" r="1.2" fill="#06b6d4" opacity="0.35"/>
  <circle cx="40" cy="20" r="0.8" fill="#06b6d4" opacity="0.2"/>
  <circle cx="20" cy="40" r="0.8" fill="#14b8a6" opacity="0.2"/>
  <circle cx="50" cy="50" r="0.6" fill="#06b6d4" opacity="0.1"/>
  <!-- Small dashboard element near corner -->
  <rect x="4" y="4" width="32" height="24" rx="5" fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="0.5"/>
  <rect x="8" y="8" width="24" height="4" rx="2" fill="#06b6d4" opacity="0.2"/>
  <rect x="8" y="15" width="16" height="2.5" rx="1.25" fill="#94a3b8" opacity="0.2"/>
  <rect x="8" y="20" width="20" height="2.5" rx="1.25" fill="#64748b" opacity="0.15"/>
</svg>