<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="monoCornerGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#505050" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#252525" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Architectural corner fill -->
  <path d="M80 0 Q0 0 0 80" fill="url(#monoCornerGrad)"/>
  <!-- Corner bracket lines -->
  <g opacity="0.5">
    <line x1="80" y1="0" x2="40" y2="0" stroke="#606060" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="40" stroke="#606060" stroke-width="1.5"/>
  </g>
  <!-- Architectural bracket ticks -->
  <g opacity="0.35">
    <line x1="55" y1="0" x2="55" y2="5" stroke="#808080" stroke-width="0.8"/>
    <line x1="65" y1="0" x2="65" y2="3" stroke="#808080" stroke-width="0.6"/>
    <line x1="0" y1="55" x2="5" y2="55" stroke="#808080" stroke-width="0.8"/>
    <line x1="0" y1="65" x2="3" y2="65" stroke="#808080" stroke-width="0.6"/>
  </g>
  <!-- Diamond accent near corner -->
  <g transform="translate(25,25)" opacity="0.25">
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" fill="none" stroke="#707070" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="1.5" fill="#707070" opacity="0.5"/>
  </g>
  <!-- Dot grid accents -->
  <g opacity="0.2" fill="#606060">
    <circle cx="15" cy="15" r="0.7"/>
    <circle cx="35" cy="15" r="0.7"/>
    <circle cx="15" cy="35" r="0.7"/>
    <circle cx="45" cy="10" r="0.5"/>
    <circle cx="10" cy="45" r="0.5"/>
    <circle cx="25" cy="25" r="0.8"/>
  </g>
  <!-- Horizontal guide lines -->
  <g opacity="0.1">
    <line x1="0" y1="25" x2="30" y2="25" stroke="#808080" stroke-width="0.3"/>
    <line x1="25" y1="0" x2="25" y2="30" stroke="#808080" stroke-width="0.3"/>
  </g>
</svg>