<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="#818cf8" opacity="0.08"/>
    </pattern>
    <linearGradient id="sidebarAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="navHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a8a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4a4a8a" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#4a4a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a4a8a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="400" height="400" fill="#0f0f23"/>
  <rect width="400" height="400" fill="url(#dotGrid)"/>
  <!-- Sidebar vertical accent band -->
  <rect x="8" y="16" width="3" height="368" rx="1.5" fill="url(#sidebarAccent)"/>
  <!-- Sidebar panel -->
  <rect x="16" y="16" width="76" height="368" rx="14" fill="#151530" opacity="0.5" stroke="#2d2d5e" stroke-width="0.5"/>
  <!-- Navigation items -->
  <rect x="26" y="32" width="56" height="8" rx="4" fill="url(#navHighlight)"/>
  <circle cx="34" cy="36" r="3" fill="#818cf8" opacity="0.4"/>
  <rect x="42" y="34" width="32" height="4" rx="2" fill="#c7d2fe" opacity="0.3"/>
  <rect x="26" y="52" width="48" height="6" rx="3" fill="#4a4a8a" opacity="0.2"/>
  <rect x="26" y="68" width="56" height="6" rx="3" fill="#4a4a8a" opacity="0.2"/>
  <rect x="26" y="84" width="42" height="6" rx="3" fill="#4a4a8a" opacity="0.2"/>
  <rect x="26" y="100" width="50" height="6" rx="3" fill="#4a4a8a" opacity="0.2"/>
  <rect x="26" y="116" width="36" height="6" rx="3" fill="#4a4a8a" opacity="0.2"/>
  <!-- Nav section divider -->
  <rect x="30" y="138" width="48" height="1" fill="#2d2d5e" opacity="0.5"/>
  <!-- More nav items -->
  <rect x="26" y="150" width="44" height="6" rx="3" fill="#4a4a8a" opacity="0.15"/>
  <rect x="26" y="166" width="52" height="6" rx="3" fill="#4a4a8a" opacity="0.15"/>
  <rect x="26" y="182" width="38" height="6" rx="3" fill="#4a4a8a" opacity="0.15"/>
  <!-- Sidebar/Content divider -->
  <rect x="108" y="16" width="1" height="368" fill="url(#dividerGrad)"/>
  <!-- Main content area -->
  <!-- Header bar -->
  <rect x="120" y="16" width="264" height="28" rx="8" fill="#151530" opacity="0.4" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="136" cy="30" r="4" fill="#818cf8" opacity="0.4"/>
  <rect x="146" y="26" width="24" height="8" rx="4" fill="#a5b4fc" opacity="0.25"/>
  <rect x="340" y="22" width="32" height="16" rx="8" fill="#6366f1" opacity="0.15"/>
  <!-- Content cards row 1 -->
  <rect x="120" y="56" width="80" height="50" rx="10" fill="#151530" opacity="0.4" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="136" cy="81" r="8" fill="#818cf8" opacity="0.2"/>
  <rect x="150" y="76" width="30" height="5" rx="2.5" fill="#c7d2fe" opacity="0.3"/>
  <rect x="150" y="85" width="22" height="4" rx="2" fill="#64748b" opacity="0.2"/>
  <rect x="210" y="56" width="80" height="50" rx="10" fill="#151530" opacity="0.4" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="226" cy="81" r="8" fill="#8b5cf6" opacity="0.2"/>
  <rect x="240" y="76" width="30" height="5" rx="2.5" fill="#c7d2fe" opacity="0.3"/>
  <rect x="240" y="85" width="26" height="4" rx="2" fill="#64748b" opacity="0.2"/>
  <rect x="300" y="56" width="80" height="50" rx="10" fill="#151530" opacity="0.4" stroke="#2d2d5e" stroke-width="0.5"/>
  <circle cx="316" cy="81" r="8" fill="#6366f1" opacity="0.2"/>
  <rect x="330" y="76" width="30" height="5" rx="2.5" fill="#c7d2fe" opacity="0.3"/>
  <rect x="330" y="85" width="20" height="4" rx="2" fill="#64748b" opacity="0.2"/>
  <!-- Content cards row 2 -->
  <rect x="120" y="118" width="128" height="52" rx="10" fill="#151530" opacity="0.35" stroke="#2d2d5e" stroke-width="0.5"/>
  <polyline points="140,150 158,142 176,146 194,138 212,144 230,136" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.25"/>
  <rect x="258" y="118" width="128" height="52" rx="10" fill="#151530" opacity="0.35" stroke="#2d2d5e" stroke-width="0.5"/>
  <rect x="274" y="130" width="96" height="6" rx="3" fill="#c7d2fe" opacity="0.15"/>
  <rect x="274" y="142" width="72" height="6" rx="3" fill="#c7d2fe" opacity="0.15"/>
  <rect x="274" y="154" width="84" height="6" rx="3" fill="#c7d2fe" opacity="0.15"/>
  <!-- Bottom area - wider panel -->
  <rect x="120" y="182" width="264" height="70" rx="12" fill="#151530" opacity="0.3" stroke="#2d2d5e" stroke-width="0.5"/>
  <rect x="136" y="196" width="140" height="10" rx="5" fill="#818cf8" opacity="0.08"/>
  <rect x="136" y="212" width="160" height="8" rx="4" fill="#6366f1" opacity="0.08"/>
  <rect x="136" y="226" width="100" height="8" rx="4" fill="#334155" opacity="0.2"/>
  <!-- Subtle geometric floating shapes -->
  <rect x="190" y="320" width="20" height="20" rx="4" fill="#818cf8" opacity="0.03" transform="rotate(15 200 330)"/>
  <rect x="320" y="340" width="14" height="14" rx="3" fill="#6366f1" opacity="0.03" transform="rotate(25 327 347)"/>
  <!-- Horizontal separators -->
  <rect x="120" y="270" width="264" height="1" fill="#2d2d5e" opacity="0.3"/>
  <rect x="120" y="320" width="264" height="1" fill="#2d2d5e" opacity="0.2"/>
  <!-- Navigation indicator dot row bottom -->
  <circle cx="224" cy="390" r="3" fill="#818cf8" opacity="0.3"/>
  <circle cx="240" cy="390" r="3" fill="#818cf8" opacity="0.15"/>
  <circle cx="256" cy="390" r="3" fill="#818cf8" opacity="0.15"/>
  <circle cx="272" cy="390" r="3" fill="#818cf8" opacity="0.15"/>
</svg>