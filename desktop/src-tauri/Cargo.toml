[package]
name = "iora-desktop"
version = "0.1.0"
edition = "2021"
description = "IORA Desktop – background client connecting IORA to LM Studio"

[package.metadata.bundle]
identifier = "de.iora.desktop"
icon = ["icons/icon.png", "icons/icon.ico"]

[lib]
name = "iora_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.30"
auto-launch = "0.5"
battery = "0.7"
chrono = { version = "0.4", features = ["serde"] }
screenshots = "0.7"
image = "0.25"
base64 = "0.22"
tauri-plugin-global-shortcut = "2.3.1"
enigo = "0.6.1"
local-ip-address = "0.6"
tauri-plugin-liquid-glass = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
