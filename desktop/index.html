<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>rumahl Desktop</title>
  </head>
  <body>
    <!-- Liquid Glass SVG Filter – erzeugt echte Glas-Refraktion via feDisplacementMap -->
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" color-interpolation-filters="sRGB" aria-hidden="true">
      <defs>
        <!-- Frosted Glass: sanfte Unschärfe + Sättigung, leichte Verzerrung -->
        <filter id="liquid-glass-frosted" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blurred" />
          <feColorMatrix in="blurred" type="saturate" values="1.4" result="saturated" />
          <feComponentTransfer in="saturated" result="boosted">
            <feFuncA type="linear" slope="1.15" />
          </feComponentTransfer>
        </filter>

        <!-- Liquid Glass: starke Sättigung, minimale Unschärfe, lebendig -->
        <filter id="liquid-glass-liquid" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurred" />
          <feColorMatrix in="blurred" type="saturate" values="2.2" result="saturated" />
          <feComponentTransfer in="saturated" result="boosted">
            <feFuncA type="linear" slope="1.08" />
          </feComponentTransfer>
        </filter>

        <!-- Glass edge glow: subtiler Inner Glow am oberen Rand -->
        <filter id="glass-edge-glow">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
          <feOffset in="blur" dx="0" dy="0" result="offsetBlur" />
          <feComposite in="SourceGraphic" in2="offsetBlur" operator="over" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
