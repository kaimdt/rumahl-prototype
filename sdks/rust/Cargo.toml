[package]
name = "iora-sdk"
version = "0.1.0"
edition = "2021"
authors = ["IORA Team"]
description = "Official Rust SDK for IORA app and plugin development"
license = "MIT"
repository = "https://github.com/kaimdt/home-assistant-dashb"
keywords = ["iora", "sdk", "plugin", "app", "home-automation"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.0"

[features]
default = []
widget = []
service = []
api = []
integration = []
full = ["widget", "service", "api", "integration"]
